  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

50 — 1960<\u002Fp>\n<p style=\"margin: 26px 0 0; font-size: 15px; color: #4a5560\">程偉恆　<b style=\"font-weight: 500; color: #141b22\">編<\u002Fb><\u002Fp>\n<\u002Fdiv>\n\n<section style=\"border-top: 1px solid #c3bdb0; padding: 56px 0\">\n<div style=\"max-width: 992px; margin: 0 auto; padding: 0 22px; box-sizing: border-box\">\n<h2 style=\"margin: 0 0 8px; font-family: 'Noto Serif TC', serif; font-weight: 600; font-size: 22px\">逐日翻閱<\u002Fh2>\n<p style=\"margin: 0 0 24px; font-size: 15px; color: #4a5560\">一九五〇年一月一日至一九六〇年一月一日，每天至少一則。<\u002Fp>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 4px 2px; margin-bottom: 28px\">\n<sc-for list=\"{{ years }}\" as=\"y\" hint-placeholder-count=\"11\">\n<button sc-camel-on-click=\"{{ y.pick }}\" style=\"{{ y.style }}\">{{ y.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start\">\n\n<div style=\"flex: 999 1 460px; min-width: 0\">\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px\">\n<h3 style=\"margin: 0; font-family: 'Noto Serif TC', serif; font-weight: 600; font-size: 26px\">{{ monthTitle }}<\u002Fh3>\n<div style=\"display: flex; gap: 4px\">\n<button sc-camel-on-click=\"{{ goPrev }}\" aria-label=\"上個月\" style=\"width: 44px; height: 44px; border: 1px solid #c3bdb0; border-radius: 2px; background: #f4f2ec; color: #141b22; cursor: pointer; display: flex; align-items: center; justify-content: center\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<button sc-camel-on-click=\"{{ goNext }}\" aria-label=\"下個月\" style=\"width: 44px; height: 44px; border: 1px solid #c3bdb0; border-radius: 2px; background: #f4f2ec; color: #141b22; cursor: pointer; display: flex; align-items: cente px; margin: 0 auto; padding: 0 22px; box-sizing: border-box\">\n<p style=\"margin: 0 0 6px\">預購查詢：<a href=\"mailto:info@macaology16.com\">info@macaology16.com<\u002Fa><\u002Fp>\n<p style=\"margin: 0\">臉書：<a href=\"https://www.facebook.com/1paperculture/\" target=\"_blank\" rel=\"noopener noreferrer\">一紙文化<\u002Fa><\u002Fp>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1500}}\">\nclass Component extends DCLogic {\nstate = {};\nrenderVals() {\nconst st = this.state || {};\nconst year = st.year ?? 1950;\nconst month = st.month ?? 0;\nconst selected = st.selected ?? 1;\nconst first = new Date(year, month, 1).getDay();\nconst total = new Date(year, month + 1, 0).getDate();\nconst wk = ['日', '一', '二', '三', '四', '五', '六'];\nconst base = 'min-height:64px;padding:8px 10px;border:none;border-radius:0;font:inherit;font-size:16px;cursor:pointer;text-align:left;vertical-align:top;display:block;width:100%;box-sizing:border-box;';\nconst cells = [];\nfor (let i = 0; i < first; i++) cells.push({ blank: true, isDay: false });\nfor (let d = 1; d <= total; d++) {\nconst isSel = d === selected;\ncells.push({\nblank: false,\nisDay: true,\nlabel: d,\naria: year + '年' + (month + 1) + '月' + d + '日',\nstyle: base + (isSel ? 'background:#141b22;color:#f4f2ec;' : 'background:#f4f2ec;color:#141b22;'),\npick: () => this.setState({ year: year, month: month, selected: d })\n});\n}\nconst years = [];\nfor (let y = 1950; y <= 1960; y++) {\nconst on = y === year;\nyears.push({\nlabel: y,\nstyle: 'min-height:44px;padding:0 12px;background:transparent;border:none;border-bottom:2px solid ' + (on ? '#8c2f24' : 'transparent') + ';color:' + (on ? '#8c2f24' : '#4a5560') + ';font:inherit;font-size:15px;font-weight:' + (on ? '500' : '400') + ';cursor:pointer;',\npick: () => this.setState({ year: y, month: y === 1960 ? 0 : month, selected: 1 })\n});\n}\nconst shift = (delta) => {\nlet m = month + delta, y = year;\nif (m < 0) { m = 11; y--; }\nif (m > 11) { m = 0; y++; }\nif (y < 1950 || y > 1960 || (y === 1960 && m > 0)) return;\nthis.setState({ year: y, month: m, selected: 1 });\n};\nconst entries = {\"1950-1-1\": \"\\\"澳門學生籌組學聯\\\"\", \"1950-1-2\": \"澳門憲報發表澳督委任盧榮錫任華人代表至1952年之消息\", \"1950-1-3\": \"（1月3日）新營地街市開幕（工程師為阿納道•巴士道和塞納•飛南迪）\", \"1950-1-4\": \"一架客機從海口飛抵澳門，機上有乘客23人\", \"1950-1-5\": \"陳濟棠夫人由海口赴澳門\", \"1950-1-6\": \"澳門有一俱樂部舉行澳門小姐選舉\", \"1950-1-7\": \"澳門工聯會發動募捐，支援香港電車和火柴工人\", \"1950-1-12\": \"平安輪上午自香港返澳門，航經九洲海面時，被國軍艦隊截查\", \"1950-1-13\": \"前國民黨駐澳門黨部主委李秉碩由澳門來港，準備前往新加坡\", \"1950-1-14\": \"澳門陸軍赴港，下午將於香港陸軍進行足球比賽\", \"1950-1-18\": \"香港電車工人停工27日，香港電車工會收到13名澳門海員工會之慰問及捐助\", \"1950-1-20\": \"由澳門上架木藝工會、茶樓餅業工會、鞋業工會發起，聯合其他行業共12個工會，於澳門鏡湖醫院禮堂舉行澳門工會聯合總會成立大會\", \"1950-1-21\": \"鏡湖平民聯合小學望廈新校舍落成，舉行落成典禮，鏡湖醫院慈善會前任主席劉叙堂主持剪綵，何賢在落成典禮上致辭\", \"1950-1-31\": \"營地街市重建落成開幕，澳督剪綵，盛况空前\", \"1950-2-4\": \"郵電職工帛金會成立，當時的郵電局長為安東尼•馬家良•高甸玉。帛金會為會員設立經濟食堂、為會員子女提供渡假園地。\", \"1950-2-8\": \"澳門中華教育會下午在中華總商會二樓召開澳門僑校校長座談會，由陳道根主持，與十多位校長或代表交流意見，決定本學期開始採用新課本、新課程、童軍公民科改為體育活動、掛新國旗、唱新國歌等事\", \"1950-2-19\": \"台灣-澳門首次通航之永平輪，前因種種原因延期，今終開赴澳門，船上有旅客三百多人\", \"1950-2-25\": \"氹仔市舉行新碼頭，公路，車廠及陞像四大慶典，由澳督柯維納親臨主持一切，儀節單簡隆重，為氹仔創下歷史新頁\", \"1950-2-27\": \"陳道根發表《為推行新教育告本澳教育工作同寅及青年學生書》一文，文中提到毛澤東在全國政協會議上就新中國教育方針發言，呼籲澳門全體師生接受「新教育」\", \"1950-3-4\": \"澳門與離島之間載客航線專營規章。\", \"1950-3-8\": \"陳滿醫生創辦刊物《新園地》，並擔任社長，張陽（原名張鐵柔）擔任主編，《大眾報》編輯陳大白兼任該刊編務。《新園地》原為“新民主協會”會刊，出版時編者只注“澳門新民主協會出版委員會主編”，最初附在《大眾報》內發行，雙週刊，四期後改為旬刊，正式單獨對外發行，《新園地》屬於文藝刊物，最初為免費派發，後改為消息類報章，傾向於時事論述\", \"1950-4-30\": \"巴士工友開會通過改組巴士員工體育部，成立了公共汽車職工協會\", \"1950-5-10\": \"台灣行政院舉行院會，表示立法委員黃元彬因在澳門鼓吹人民購買中國公債，將呈請總統下令通緝\", \"1950-5-21\": \"由柯麟夫人陳智英倡議組織並籌備之澳門民主婦女聯合會正式成立，會員包括 羅柏心、張晴暉、曾枝西、陳秉卿、江貴華、黃君仿、鄭蕙航、杜嵐等人，辦公場所設於柯麟診所，成立當天出版《澳門民主婦女聯合會成立特刊》\", \"1950-5-31\": \"澳門市政廳決定下屆計車汽車繼續由東方公司承辦，續約三年，今正式簽訂合約\", \"1950-6-3\": \"救總召開常務理監事聯席會議，商討救濟流亡港九、澳門難民辦法\", \"1950-6-6\": \"澳門中華教育會刊物《澳門新教育》於教師節創刊，作為推廣「新教育」的重要媒介\", \"1950-6-21\": \"澳門南通銀號於新馬路正式營業，董事長為柯麟，總經理為柯正平\", \"1950-6-25\": \"鏡湖醫院慈善會在蓮峰球場舉行“游藝籌款大會”，得到各方支持，粵劇紅伶白雪仙、黃千歲合唱“鏡湖方便救蒼生”，經濟局局長羅保指揮綠村管弦樂隊演奏等演出\", \"1950-6-26\": \"鏡湖醫院在南灣戲院續舉行“游藝籌款大會”，粵劇紅伶余麗珍、羅品超、石燕子、譚玉真義唱等演出；兩天義演收到特別捐助及銷售入場券款項，共計葡幣壹拾捌萬餘元，全用於興建診室及殯儀館\", \"1950-7-1\": \"聯義體育會及紅黑體育會，為擴展會務，籌募經費，聯合與辦港澳小型球義賽，經各方努力奔走，商得香港西區覇主黑灰隊同意，來澳表演，今日開始，一連舉行三天，各場秩序，亦經編妥\", \"1950-7-8\": \"繼《先聲報》後，《澳門》週報面世\", \"1950-7-12\": \"台灣行政院舉行政務會議，通過外交部呈請設立駐澳門辦事機構一案\", \"1950-7-22\": \"修訂當押店營業規定，此事因賭博存在而成為當時和今天澳門的重大事項\", \"1950-7-28\": \"澳門中華教育會再次召開澳門僑校校長會議，但僅有14所學校派出代表與會，不足當時僑校三分之一數量，因此臨時改為座談會，其中一頂討論內容為下學期各校須採用人民政府頒佈之課程及教材\", \"1950-8-1\": \"澳門中華教育會正式將會址從聖若瑟中學遷往中華總商會二樓辦公\", \"1950-8-11\": \"一架載滿黃金的飛機，從泰國曼谷飛往澳門途中，飛越中山縣時遭到射擊，所幸未中彈，安然到達澳門\", \"1950-9-2\": \"南灣銀業球場為鏡湖醫院籌款舉行籃球義賽，香港南華籃球隊對澳門中華籃球隊\", \"1950-9-22\": \"美國商務部宣佈鑑於國家安全需要，任何運往香港、澳門兩地的貨物，都要經過審查\", \"1950-10-2\": \"英國轉而承認中華人民共和國政權,使外交部駐兩廣特派公署香港辦事處,以及外交部駐香港貨單專員辦事處先後關閉，\\n這些機構的業務轉由駐澳專員辦理。為此,中華民國政府正式設立「中華民國外交部駐澳門專員辦事處」\", \"1950-10-10\": \"私立華南大學創立，校長王冠英，王曉籟等卅二人為董事\", \"1950-10-14\": \"用以承擔救濟逃避中國內戰的難民的費用的特開款項\", \"1950-11-1\": \"教宗庇護十二世宣布聖母靈內升天爲信道，當日澳門教區隆重慶祝，晚上於教區修院舉行聯歡會時，聖堂大放光明\", \"1950-12-13\": \"青洲坊大火，燒毀400間木屋，約2000人無家可歸。\", \"1951-1-6\": \"通過殖民地稅務施行法典，並廢除以往的一切規定\", \"1951-1-10\": \"香港美國總領事館發出公函，呼籲居澳門和英殖民地華裔美國公民家長撤走其家人及財產\", \"1951-1-15\": \"澳門工務局重建青洲坊木屋，安置上年12月因大火失去住所的災民\", \"1951-2-3\": \"台灣省生產事業管理委員會開會，決定禁止台灣生產之水泥運往澳門，以免流入中國大陸\", \"1951-2-16\": \"奉僑務委員會准予立之澳門私立鏡湖高級護士助產職業學校，因政局轉變，獲北京中央衛生部批覆准予立案，正式改名為澳門私立鏡湖護士助產學校\", \"1951-3-12\": \"中山教育學院為紀念國父逝世二十六周年，今起一連七天，將於該院圖書館展出國父遺墨及照片\", \"1951-3-17\": \"因澳門難民請求救濟，救總曾電報駐澳專員郭則范，請他策動地方人士組織救濟團體，再由救濟協助救濟工作，但郭回覆澳門情形特殊，組織團體不易，再擬意見交救總；內政部召集會議，討論救濟辦法\", \"1951-3-21\": \"駐日軍事代表團團長何世禮在東京向外長發電報，指英文日本時報稱台灣國民黨避難商人曾以汽油及燃油50萬公斤售中共，該油系於2月尾由巴拿馬船飛龍號偷運至澳門，再由小船轉往中國，台北及基隆官員獲利7萬5千美元，且尚有偷運計劃，請有關當局查明\", \"1951-3-26\": \"救總顧及澳門難民生活困苦，在台灣政府確定救濟辦法前，先撥出10萬台幣，交駐澳專員郭則范統籌運用\", \"1951-3-31\": \"委任九澳地保（管理人）鍾中\", \"1951-4-1\": \"前華人代表盧榮錫因體弱多病、商務繁重，無瑕出席政務會議而向政府請辭，政府今公佈新任華人代表為李寶田，李為德記船務公司經理、傅德蔭女婿\", \"1951-4-2\": \"台灣省政府交通處派人到港澳調查飛龍號事件，經查香港官定油價與澳門黑市價相差甚多，飛龍號在澳門偷售輕柴油50噸及重柴油50噸，其中輕柴油可能是在基隆所購\", \"1951-4-16\": \"澳督柯維納將回葡述職，今召開最後一次政務會議，各委員與澳督互相道別祝賀\", \"1951-4-18\": \"澳門新聞界為聯絡香港同業感情，大眾、華僑、精華、世界、市民等報社組成澳門記者香港訪問團，團員包括何賢、梁昌、鍾子光、傅德蔭、高可寧等四十多人，今到香港訪問\", \"1951-4-24\": \"台灣立法院舉行第十三次院會通過一項決議，其中提到呼籲國際救濟機構對流亡香港、澳門等地中國難民進行救濟\", \"1951-4-25\": \"救總再匯10萬台幣用作救濟澳門難民\", \"1951-5-1\": \"因修改1933年憲法以及廢除殖民地法案，殖民地改稱“海外省”\", \"1951-5-11\": \"美國駐香港總領事雅格爾(Joseph Yager)訪問澳門，此行主要是監察澳門燃料油及汽油使用的 情況及其輸出\", \"1951-5-21\": \"歷時三年，新政府合署大廈落成，此大廈按新政體建築設計模式興建\", \"1951-5-25\": \"本澳西北方突微聞爆炸聲三响，旋此間港務局卽接獲消息，據查係本澳對海氹仔廣興泰炮竹廠工場一角，發生爆炸，爆傷女工二人及一小童\", \"1951-5-26\": \"澳門天主教首位華人紅衣大司鐸、澳門中華教育會首任會長、曾任華人代表的劉雅覺神父逝世\", \"1951-6-6\": \"葡國殖民部今對外否認澳門已成為中國戰略物資供應站\", \"1951-6-21\": \"著名畫家高劍父於澳門病逝\", \"1951-7-3\": \"救總舉行第四次聯席會議，為救助港澳來台難民參加生產工作，通過籌辦文山養業復興實驗區\", \"1951-7-7\": \"召集澳門選舉團體開會，以便選舉葡國新總統\", \"1951-7-19\": \"美 國駐里斯本大使館於7月19日向葡萄牙政府提交一份備忘錄，詳細地 敘連了於5月18日、 25日及26日在香港截獲的三艘非法向澳門運送 大量潤滑油的日本機帆船， 其最終目的地是中國\", \"1951-7-25\": \"台灣指責澳門沒有嚴格執行禁運，大批戰略物資輸出中國大陸，政府計劃採取行動讓聯合國向葡國施壓，使葡國與其他國家有更多合作，在經濟方面打擊共產主義\", \"1951-8-8\": \"邀請澳門居民向葡國新總統羅庇士將軍致意\", \"1951-9-8\": \"氹仔設立試驗性的支援和收容流浪乞丐中心\", \"1951-9-17\": \"救總聯同澳門政府，分擔經費，在氹仔設立難民營，收容16歲以上的難民300多人\", \"1951-9-21\": \"氹仔難民營引用香港調景嶺先例，組織自治會，採理監事制\", \"1951-10-15\": \"新任駐澳門專員陳元屏離港赴澳履新，對記者表示將盡量簡化簽發護照手續，至於此前發現有人偽造護照一事，陳表示申領護照須照正當手續至駐澳辦辦理\", \"1951-10-17\": \"提督路大火 電油倉爆炸\\n昌明火柴廠貨倉起火 波及屋宇廾六間 焚斃一癱病老婦 損失葡幣百萬 為卅五年來住屋區空前大火災，初步估計全部損失，在葡幣百萬以上\", \"1951-10-21\": \"商界人士表示，澳門開始限制西德重要物資入口，由於香港六月間加緊進口管制，香港商人將被限制之西德貨物轉運澳門\", \"1951-11-10\": \"重新供應離島電力\", \"1951-11-14\": \"合成碼頭發生爆炸\", \"1951-11-23\": \"新任澳督史伯泰（Joaquim Marques Esparteiro）就任\", \"1951-11-24\": \"商人馬萬褀住宅發生爆炸\", \"1951-11-30\": \"澳督史伯泰單獨接見駐澳專員陳元屏，雙方暢談片刻後互相道別\", \"1951-12-8\": \"澳門明愛前身利瑪竇社會服務中心，由陸毅神父 創辦\", \"1951-12-15\": \"香港限制澳門粵籍旅客入境，持有移民局證件方可入境，此舉對商業旅客至為不便，華人代表李寶田為此與澳督會面，請政府與香港協商此事\", \"1951-12-16\": \"澳門中華總商會改選理監事\", \"1951-12-17\": \"澳門中華總商會改選理監事後，理事長何賢、副理事長周賜達以「難以勝任」為由請辭\", \"1951-12-18\": \"澳門中華總商會再有理事梁昌、監事長劉柏盈請辭，該會因此召開理監事緊急聯席會議，認為因何賢請辭導致多人請辭，將挽留何賢以打消其他人請辭想法\", \"1951-12-19\": \"每年一次之港澳警察聯防治安座談會，今年輪到澳門舉行，香港警務處長麥景陶由港澳來，澳門警察局長到碼頭迎接\", \"1951-12-31\": \"澳門中華總商會發生爆炸\", \"1952-1-1\": \"公共汽車公司以虧損為由停辦，澳門市面交通頓時大受影響\", \"1952-1-4\": \"澳葡當局法令規定6月10日為葡國日\", \"1952-1-19\": \"葡國海外部長辦公室主任與科塔、內圖、塔羅索（Traciano Tarroso）及巴斯托斯（P．Bastos）舉行會議，討論立法及禁止向中國 輸出的甲級物資單及“可以向中國出口或出讓用來交換澳門省所需要 的生活物資的單子”。這稱為B類產品單\", \"1952-1-20\": \"澳門中華總商會重新選舉理監事，何賢再任理事長，馬萬祺、周賜達任副理事長，劉柏盈再任監事長\", \"1952-1-23\": \"澳督史伯泰受葡國海外部及外交部指示，成立了貿易協調委員會，並任命五名該委員會的成員\", \"1952-1-24\": \"流澳難民代表劉鑄、祝聘之、蔣國鈞、李之泰等122人呼籲救濟，請求收容他們到台灣，並在澳門組織流澳難胞聯誼會\", \"1952-1-27\": \"新橋渡船街連勝馬路口之銀城大戲院。經於本月廿七日曲辰曆元旦舉行開幕。該院為隆重其事起見，特別恭請七彩艷后周坤玲小姐，藝術艷旦羅麗娟小姐親臨剪綵。是日到有各機關首長僑領紳商名流，新聞界及中西來賓千餘人，情形至為熱鬧，由該院董事長鄭鏡泉偕同院方辦事人員親在門前迎迂嘉賓\", \"1952-1-30\": \"美國駐香港副總領事亨特(Hunt)來澳訪問，亨特表示樂見貿易協調委員會之成立，以及葡國限制向中國郵寄戰略物資之措施\", \"1952-2-5\": \"澳門總督史伯泰向海外部長羅瑟文彙報說，近期在廣州召開 了一次關於澳門的會議。參加的有高級政治人士。支持北京的澳門華 人社團精英也有代表參加會議。在會上，有些與會者要求，如果葡萄 牙跟隨美國政策的話，中國政府應該對澳門的葡萄牙政府採取敵視態 度，而澳門華人社團精英代表則一致認為不應該對澳門採取甚麼敵對 行動\", \"1952-2-15\": \"本澳籌建經年，萬衆矚目，堂煌富麗的永樂大戲院，已定於本日隆重盛大開幕，正午十二時招待全市政，軍，警各機關首長，工商，文化曁其他客界約千餘人。下午二時開始賣門票七時半開始正式營業，第一炮首映係轟動國際影壇的「解放了的中國」名片\", \"1952-2-21\": \"何賢、劉昌等人以47萬收購公共汽車公司，此日正式成立「澳門福利公共汽車股份有限公司」，承辦公共汽車公司營運之路線\", \"1952-3-1\": \"永樂戲院放映「團結起來到明天」，因此片此前被澳門政府審查時告知不准放映，警方得知戲院下午仍放映此片，派出大批警員強行停映，經何賢調解後，晚上獲政府批准放映\", \"1952-3-5\": \"警方於1日前往永樂戲院強行停映時，打傷水電工人鄭求、旅業工人陶海良，水電、旅業工人代表今第五次拜訪警察廳長，廳長原本拒絕會面，後來邀請何賢、工聯會理事長梁培、經濟局長羅保一同出席調解，經過兩小時談判後，廳長最後接納三項要求，包括賠償、懲處肇事警方、保證不再發生，工人代表認為得到合理答覆\", \"1952-3-22\": \"時任澳門駐軍司令情報處處長陸軍上尉薩爾加多(Álvaro Marques de Andrade Salgado)，進行帆船活動時，疑似迷航而靠近小橫琴島，被中國拘捕\", \"1952-3-23\": \"門勞工教育協進會新建的勞工子弟學校校舍建築工程經過短短的四個多月的時光已經勝利地竣工，並於今（廿三）日中午十一時在新校舍舉行開幕，邀請各業工會，社團，學校等到校觀禮\", \"1952-3-27\": \"中央改造委員會第三組向外交部電報，據報國軍集中營有人被中共及第三勢力收買，暗中破壞營中團結，列表請察核官兵7人，並請轉請陳元屏商澳府負責人商予整肅，並檢附調查名單\", \"1952-4-12\": \"澳門工會聯合總會主辦的工人醫療所，從去年三月十五日開幕到現在，已經一週年了，曾在保障工人健康事業上，有了不少貢獻。為了慶祝醫療所週年紀念，工聯總會擴大慶祝工人醫療所籌備委員會，定期今（十二）日晚上假勞校舉行盛大的慶祝晚會，慶祝醫療所的𧩙生週年\", \"1952-4-15\": \"中央改造委員會第三組向外交部電報，據黨駐澳門黨務負責人報告，現續查第三勢力張松軒、王少珍賄警進入國軍集中營活動，欲爭取該營領導權，已令該營忠貞同志注意外，現該營又有5名官兵被收買，破壞營中團結，應連同前案請陳元屏商澳府設法整肅\", \"1952-4-19\": \"海外部長羅瑟文司令官訪澳期間，離島第一期電力工程揭幕\", \"1952-4-23\": \"永樂戲院晚上放映「江湖兒女」，戲院後門突然發生爆炸出現巨響，觀眾爭相逃走，警誠聞訊後到場調查\", \"1952-4-30\": \"香港土生葡人白樂嘉在葡國里斯本地理學會演講，提出應該在1955年11月20日紀念澳門開埠四百周年\", \"1952-5-1\": \"工聯會糾察隊於花王堂區制止蘇英張貼侮辱北京政府傳單，警方到場將雙方人員帶回三區，過程中打傷糾察隊成員黃保全，工人代表即前往警局交涉\", \"1952-5-14\": \"駐澳專員陳元屏返台述職，行前告訴記者，對僑胞關心之護照問題，將設法改善，力求申領手續簡捷，請大家必勿受騙，申辦護照須到駐澳辦辦理\", \"1952-5-15\": \"鄺仲明、陳錦元、陳演生、蘇英等4人來駐澳辦，帶有中國青年反共抗俄聯合會直屬香港分會澳門區聯絡辦公處致本處呈一件，稱蘇英於5.1在外貼報，被人歐打，請駐澳辦函送蘇英往山頂醫院治療，該會已發動HK同志募捐，如有藥物、金錢寄來，請駐澳辦代收，駐澳辦除勸慰外，其餘事予拒絕\", \"1952-5-18\": \"工聯會發表聲明，對五月一日「美蔣特務」歐打工人及警方拘捕工人一事，對澳門政府提出嚴正抗議，並提出四項要求\", \"1952-5-19\": \"梁培、柳志彬等七人代表工人，與代表政府之經濟局長羅保進行交涉，工人代表提出抗議書，並提出四項要求，包括嚴懲主事者及道歉、賠償、嚴懲「蔣幫特務」、有效防止「美蔣特務」往後破壞治安行為，羅保表示原則性同意，但需要澳門政府討論後再切實答覆\", \"1952-5-21\": \"澳門中華總商會常務監事、四邑同鄉會主席劉柏盈病逝\", \"1952-5-22\": \"中澳邊境發生衝突\", \"1952-5-26\": \"中共在中華總商會集會，以警方處理「5.1不事件」不公，在會場外用擴音器痛陳警方，引路人聚集致路塞，交警出面勸散人群，但混在人群中共匪打警方並想奪械，其後大批警員到場後混戰，雙方互有傷，其後中共要求嚴懲在場員警不果，中共於是揚言要在海外部長羅瑟文訪澳時發動罷工\", \"1952-5-30\": \"經濟局長羅保第七次與工人代表商談「5.1事件」，對其所提四項要求予以切實回覆，包括懲處警員、緝拿蘇英歸案、賠償、嚴懲之前破壞澳門治安人士，澳門政府表示此事已獲解決\", \"1952-5-31\": \"中共打傷蘇英，包圍警局，警方將為首者略以懲處，引中共不滿，多方威脅下，以澳門經濟局長羅保為代表在澳門各報登道歉，承認錯誤，同時通緝在街上標貼侮辱中華人民共和國之蘇英，此事刊出後，蘇英秘密移往另處\", \"1952-6-13\": \"駐澳辦向外交部發函，指最近永樂戲院放映烏鴉與麻雀，各報登廣告多刪去侮辱我國政府及元首文字，除大眾報及市民日報，查「5.1事件」後，澳府對中共多忍讓，在此情況下提出抗議成效有限\", \"1952-6-19\": \"扎資一百五十萬元之新花園市政泳池開幕，5000多人觀禮\", \"1952-6-20\": \"海外部長羅瑟文參觀新合署大廈並主持地區法院開幕\", \"1952-6-22\": \"蓮峯場上，原舉行中國式游藝大會，內有舞獅，舞龍，高脚色，潮洲音樂，及粵劇六國大封相等演出\", \"1952-6-23\": \"澳門圖書館升級為國家圖書館，此時該館擁有各類書籍超過60,000冊\", \"1952-6-24\": \"海外部長因颱風而延遲到達澳門\", \"1952-6-25\": \"永樂戲院晚上放映「希望在人間」，近完場時突然有座位發生小爆炸，警方到場調查後，戲院繼續放映\", \"1952-6-26\": \"駐澳專員陳元屏設宴，款待葡海外部長羅瑟文\", \"1952-6-28\": \"海外部長在澳督府代表葡國總統向本地傑出人士頒授榮譽勛章，其中包括何賢、傅德蔭、高可寧等\", \"1952-7-1\": \"澳門工商界人士在廣州參觀華南物資交流大會後，認識到中國內地物質富饒，工農業生產發展迅速，產品價廉物美，故柯正平先生、馬萬祺先生、何賢先生、高振武先生、陳直生先生、梁秩智先生等愛國商人成立“中國土特產公司”，專營國產貨品\", \"1952-7-4\": \"國民黨中央改造委員會第六組向外交部提交一份中共在澳門特務組織報告，內容包括秘密的組織，公司、公開組織，其負責人及地址\", \"1952-7-9\": \"台灣情報機構情資顯示，廣州財經分會專員葉杜英來澳門，聽取關於港澳禁運的會報\", \"1952-7-10\": \"一封自稱澳門華僑代表的信，署名李石虹、孫滿堂、林介眉、陳述經、吳嘯峰等去函總統蔣介石，指駐澳專員陳元屏除護照事務外，其餘僑胞大小事一概不理，批評陳無能\", \"1952-7-19\": \"澳督史伯泰表示為了使黃金進口得到妥善監察，成立黃金進口監察委員會\", \"1952-7-21\": \"一名婦人持一張名林國基的赴日護照，至駐澳辦請求延有效期，駐澳辦人員發現護照上駐澳辦印信以及駐澳專員陳元屏私章均為假冒，於是報警拘捕婦人，經調查後拘捕假冒主事人郭紹生\", \"1952-7-24\": \"雙週刊《號角報》創刊\", \"1952-7-25\": \"傍晚， 當一位葡國士兵在19點15分左右準備關閉邊界時，中葡雙方發生衝突。葡方上士莫尼斯（Manuel Moniz）及六名莫桑比克士兵受傷\", \"1952-7-26\": \"中澳邊界在早晨8點 20分左右又發生衝突，葡國駐軍參謀長趕到出事地點，他下令停火，然而晚上6點又起衝突，造成中國死傷眾多。中國這天起對澳門實施禁運，封鎖陸地、海上交通\", \"1952-7-27\": \"中葡雙方經談判後，下午同意恢復雙方陸地、海上交通\", \"1952-7-28\": \"北京國際廣播電台接連發表評論要求葡方對中方的損失進行賠償\", \"1952-7-29\": \"中葡雙方衝突事件再發生，從21點27分開始，雙方交火到21 點55分才停止\", \"1952-7-30\": \"澳督史伯泰要求葡萄牙駐香港副領事里貝羅（Fernando Alberto de Meneses Ribeiro）與港英進行交涉，要求他們立即請求“通過英國當局 進行周旋，以達成一項結束目前緊張狀況的協定基礎，後英方回覆無力協助葡方\", \"1952-7-31\": \"鑑於澳門情勢，薩拉查指示葡萄牙駐華盛頓大使費爾南德斯(Luís Esteves Fernandes)與美 國國務卿進行交涉，要求減緩西方對中國，尤其是對澳門的禁運\", \"1952-8-1\": \"在與美國國務院西歐司長平東（Homer Morrison Byington Ⅱ）的會 晤中，葡萄牙大使斷言說，“中國人之所以發起進攻，完全是禁運政 策的後果，因此，必須立即採取補救措施。葡萄牙駐華盛頓大使強調 說，解決的辦法可以是允許澳門當局通過中間人向廣東省要求，在不 遠的將來重新開始出口某些貨物\", \"1952-8-2\": \"中方允許通過水路向澳門提 供給養。然而這一措施的規模不足以滿足全部居民的需要，並在經濟 領域造成很多困難\", \"1952-8-4\": \"為緩和緊張的局勢，中國下令將住在關 閘附近的中國居民撤退到中山縣的縣城石歧鎮。它位於澳門以北35公 里處。並且派了中國人民解放軍第四野戰軍的一個團進入珠海地 區\", \"1952-8-5\": \"里斯本召開部長會議，主要議題是澳門的政治軍事 形勢\", \"1952-8-6\": \"國軍集中營自治會向駐澳辦陳報，稱黃中一以自治會代表把持會務，自成立後未舉行全體大會，委員會亦堅拒召開，黃利用職權對外撞騙，對內離間，不如己意者，均指為第三勢力或不法份子，同仁有感中共勢大不與其計較，但黃變本加厲，同仁忍無可忍，於8月4日召開全體大會一致通過罷免黃，改推梁應松暫行接管並籌備選舉\", \"1952-8-9\": \"何賢和馬萬祺再次前往中國， 與中國當局會談了約三 個小時\", \"1952-8-11\": \"中方允許澳門從灣仔島用舢板運過去的廉價花卉和幾千斤蔬菜\", \"1952-8-12\": \"羅瑟文部長發電報予澳門總督，通報了何賢致李作鵬將軍 函的內容，收到電報後，何賢和馬萬祺又 與廣東當局進行了會晤\", \"1952-8-14\": \"被告郭紹生被控假冒駐澳辦印信，以及駐澳專員陳元屏私章案，法庭今判罪名成立，處一年徒刑\", \"1952-8-16\": \"何賢和馬萬祺第六次前往中國大陸商討中澳衝突事件\", \"1952-8-17\": \"何賢和馬萬祺第七次前往中國大陸進行談判，回澳後即與羅保會面\", \"1952-8-18\": \"國軍集中營自治會再向駐澳辦陳報，稱自治會因故罷免黃，於8月16日全體大會決議推顧華強、梁應松、李世昌、陳志英、周寶楠等為常務，負責會務\", \"1952-8-19\": \"何賢和馬萬祺再次前往中山商談，據傳中國突然修改協議內容，使中葡無法達成協議\", \"1952-8-20\": \"中澳雙方再次會面，但談判沒有進展\", \"1952-8-22\": \"澳門政府首次為中澳邊境衝突事件發表公報，表示談判已露出最後有利的進展\", \"1952-8-23\": \"羅保代表澳門政府“前 往邊境線。在那裡確定中方收到了我們的條件（以羅保個人的名義表示道歉、賠償等）。當時在場的還有何賢 和馬萬祺。”他簽了字並親手將正式的道歉書交給廣東軍區參謀長李 作鵬將軍\", \"1952-8-25\": \"澳門與中國陸地、海上交通全面恢復，自上月邊境衝突事件後，雙方交通已封鎖一個月\", \"1952-8-26\": \"澳門清華倉庫晚上被兩枚定時炸彈引爆，發生火災，一批貨物被燒毀\", \"1952-9-3\": \"周恩來與斯大林會面時，斯大林曾詢問澳門邊界衝突一事，周回說澳門仍像以前 一樣在葡萄牙手中，斯表示一定要驅逐那些處於中國大門的渣滓\", \"1952-9-7\": \"孫中山嫡妻盧慕貞病逝\", \"1952-9-9\": \"駐澳專員陳元屏到孫府吊唁時，孫府親戚稱有國民黨地下工作人員陳鎮鴻稱其代總統送花圈，孫府覺有異，因總統送花圈應會令駐澳辦；當時駐澳辦尚未接總統令，於是向國民黨部負責人陳魯慎查詢，其答黨部未有奉命\", \"1952-9-10\": \"1951年黨部駐澳門辦事處策組多個自由工會，同年秋發動自由工會籌組聯合性質組織，至1952年7月，多個自由工會代表依章產生後，經2月多籌備，正式成立「澳門工團聯會總會籌備會」\", \"1952-9-12\": \"駐澳辦向外交部回報，接到命令後即代總統向孫府送花圈、唁電、奠儀\", \"1952-9-20\": \"澳門憲報公佈對主要物資進行管制，進出口物資均由商務調整委員會負責辦理，規定商戶入口物資時，事前需得到商務調整委員會批准，同時提交物資來源、物資用途等資料，並需註明物資是用於本地工廠或建築，而不是轉出口。而入口爆炸品，須先得到民政廳批准\", \"1952-9-23\": \"體育教師聯合會召開會員大會，選出第七屆幹事，張錦璇、崔耀璜、陳虹、羅賢海、李守敦、衛家祥、黃壽山、馮耀漢、羅伯強等人當選，將參加本年教師節及雙十節藍球賽\", \"1952-9-26\": \"救總召開第三屆第五次聯席會議，通過再撥款五萬港元救濟澳門難民\", \"1952-10-6\": \"國軍集中營自治會轉該營湖北人吳偉具狀檢舉湖北旅澳同鄉會理事長黃中一之函予駐澳辦，指黃侵吞由湖北省留港難胞聯誼會轉發之救濟金HKD1千3百元，並偽造函文稱匯來款項4百，\", \"1952-10-11\": \"新近落成位於監牢斜巷之東方大戲院，昨晚九時舉行開幕典禮，時屆，院前花牌遍佈，車水馬龍，到有澳督史伯泰曁夫人女公子，各機關首長，僑領何賢等，由院方主事人黃仲良，黃家駒等招待，一時嘉賓雲集，達千數百人\", \"1952-10-13\": \"流澳湖北難胞張保森向駐澳辦控告黃中一把持會務、吞救濟金，駐澳辦向湖北省留港難胞聯誼會查詢，該會理事長王子法證實黃中一有侵吞款項\", \"1952-10-21\": \"台灣僑務會議開幕，澳門由李寶田、何心源、鄧晴隆代表出席會議\", \"1952-10-25\": \"澳門工團總會選出第一屆理監事\", \"1952-10-27\": \"澳門回國觀光團抵台，預計留台一個月，團長霍寶潤發表談話，表示之行目的之一是一睹台灣之復興\", \"1952-10-29\": \"國防部向外交部電報，據報國軍集中營原有自治委員會，由黃中一任主委，負營區管理，三年來頗受好評，但黃個性剛直，管理極嚴，有少數份子不滿，41年初第三勢力張松軒滲入營，拉攏不滿人士，離間營中人員，向澳府指黃行為不檢，並召集營中開會（開會者未過半數）罷免黃中一，非法選出顧華強、梁運松、李世昌、陳老英、周寶楠等5人為常委，並將改選經過報澳府，聞澳府對顧等頗表不滿\", \"1952-11-2\": \"傅德蔭寓所舉行招待會，慶祝懷念先人的兩座樓宇揭幕\", \"1952-11-3\": \"港澳天主教各界回國觀光團澳門區一行八人搭乘太古公司之盛京輪自香港抵達基隆，彼等下輪後即由僑委會派員陪同專車赴台北與前週先行來台的香港區十九人會合，彼等職業包括傳教士、醫生、教員等一名單如下：呂子修、呂子莊、許伯祿、謝若瑟、曾秀珠（女）倪雲珠（女）、梁琪芝（女）、梁照梅（女）\", \"1952-11-5\": \"葡萄牙外交部 長庫尼亞發佈了一個秘密通報，向所有葡萄牙駐多 國出口控制協調委員會成員國的使館通報了澳門邊界事件的情況\", \"1952-11-11\": \"澳督史伯泰特在總督府接見往訪之何東爵紳。何氏是日由女秘書張秀華扶持，並由崔瑞女士引導前往，當何氏抵督府弍樓時，卽由澳督史伯泰親白延入會客室，雙方分賓主坐下後，開始暢談，澳督對何氏此種高義，備極贊揚，並謂，葡京當局托彼在澳頒發紀念勛章與何氏，聊表彰其偉蹟云。旋卽取出該勛章與何氏觀看，賓主暢談片刻\", \"1952-11-13\": \"澳門回國觀光團今召開記者會，該團秘書潘慶章代表全團發表感想，表示台灣各方面發展超出預料等，另工團總會秘書陳鎮鴻報告澳門工會情況，稱工人受總統精神號召下，正發揮革命精神\", \"1952-11-17\": \"何賢新居竹仔室圍牆遭人放置炸彈，發生巨大爆炸聲，警方到場調查，此前何賢舊居荷蘭園正街亦曾被人放置炸彈\", \"1952-11-18\": \"山頂醫院開始建設新廈三期工程中的第一期工程\", \"1952-11-23\": \"華人代表李寶田飛往日本時路徑台灣，今接受中央社記者訪問，大談遊台感受\", \"1952-11-30\": \"澳門工團聯合總會正式成立\", \"1952-12-1\": \"郭信堅與梁錫光擔任鏡湖醫院副院長\", \"1952-12-3\": \"澳葡紀念聖方濟各‧沙勿略（São Francisco Xavier）神父在上川島逝世400週年\", \"1952-12-17\": \"由澳門葡籍馬貴斯擔任船長之「年達輪」起義歸台（船長後遣送回澳）\", \"1952-12-25\": \"籌備多時的「澳門工團總會」（下稱工總）終於成立， 該會並非由個人所組成，而是由 13 個不同工種的「自由工會」為單位組成。工 總常任理事林大生在成立大會中發表講話，指出「自由工會」將會「成為一支堅 強反共的隊伍」，更一直進行「工運策反工作」，成功策反了「華人機工總會」、 「小販聯合總會」、「單車職業工會」等多個工會，成效卓越\", \"1953-1-4\": \"澳門府再委任李寶田為政務會議華人代表，另委任工務局長、左次治律師為政務委員\", \"1953-1-17\": \"澳門頒佈條例中譯本，凡申領貨物輸入許可證不准轉讓，及須按貨值繳交按金百分之二十至三十五\", \"1953-1-19\": \"澳門中華海員自由工會成立，理事長陳源代表全澳會員宣誓效忠黨國\", \"1953-1-23\": \"澳門商務調整委員會召開會議，討論昨日開始實施之管制主要物資出口新條例細節及執行問題\", \"1953-1-29\": \"因負責國軍集中營伙食之包商，中間剝削過甚，救總請駐澳專員陳元屏交涉改善\", \"1953-2-1\": \"日前美國指責不少戰略物資經澳門運往中國，今澳門政府宣佈「禁止液體燃料出口」\", \"1953-2-3\": \"許克祥將軍從澳門到香港乘永生輪今抵達基隆，趙恆惕、魯蕩平、韓中石等人到碼頭歡迎\", \"1953-2-6\": \"美國商務部宣佈放寬對部分國家、香港、澳門等地區，包含某些工業機器及零件、某些化學原料等五十多項商品之出口管制\", \"1953-2-8\": \"葡國電影\\\"路易•蘇沙修士\\\"在澳門東方戲院首次公演\", \"1953-2-17\": \"印度主敎魯若瑟由其妹妹魯絲嘉陪同抵澳\", \"1953-3-1\": \"澳門各界僑胞紀念蔣總統復行視事三週年，經數度籌備會議，決定擴大熱烈慶祝，假海鏡戲院慶祝大會，晚間舉行聯歡敘餐，當日并簽訂華僑反共救國公約，以實際行動對總統表示崇高敬意\", \"1953-3-3\": \"救總撥出五萬港幣，交由駐澳專員陳元屏進行普遍救濟\", \"1953-3-5\": \"下午有百餘人包圍黃承山住宅，這批人打算洗刧黃宅，不料被黃承山發現，雙方繼而爆發槍戰。警方到場後拘捕三十四人，搜出一批軍火及武器，同時將三十四人以有組織之強徒入屋行刧移交法院審理\", \"1953-3-6\": \"澳門氣象台開始在電台播送氣象報吿\", \"1953-3-10\": \"因澳門附近海面有船被中共擊沉，報章指該船人員為台灣海上游擊隊第二縱隊，負責人蕭景兆、黃淇藻稱受國防部委派，將在澳門舉行追悼會，邀請駐澳辦參加\", \"1953-3-12\": \"片名「蔣總統」的蔣總統事蹟紀錄影片在海鏡戲院公映。蔣總統過去歷史雖然深印僑胞腦海，但在銀幕上從沒有系統的介紹過，此次國防部總政治部攝製的影片，能有機會在澳門公映，僑胞都非常興奮，以先睹為快。海鏡戲院雖將票價提高至超出原來價目兩倍\", \"1953-3-14\": \"中國青年反共抗俄聯合會直屬香港分會澳門區聯絡員辦事處成立，電告駐澳辦，請駐澳專員陳元屏任顧問被拒\", \"1953-3-19\": \"聖若瑟修院聖堂於羅若望主教及院長阮振華神父策劃下完成裝修，於聖若瑟瞻禮隆重啓用\", \"1953-3-21\": \"中國駐中澳邊境守軍晚上實施防空燈火管制，據傳是因軍事演習\", \"1953-4-4\": \"規定在外港建泳棚，作為消閒（游泳及風帆）之用\", \"1953-4-9\": \"在主敎座堂為第一次世界大戰犧牲的戰士亡魂舉行代禱彌撒\", \"1953-4-14\": \"「自由中國照片」第三次海外巡迴展覽在澳門展出，一連七天，該項照片係澳門華人機器總工會奉我僑委會委托主辦\", \"1953-4-17\": \"外傳駐澳辦正考慮將國軍集中營一百八十多人遣送台灣，駐澳專員陳元屏今對記者表示對此事無所聞\", \"1953-4-18\": \"支持在氹仔和路環的學校敎授和推廣葡語\", \"1953-4-24\": \"香港移民條例實施後，由澳往港人數須等同由港來澳人數，澳門航運大受影響，港澳綫客輪聯營處請華人代表李寶田與英國駐澳領事交涉，今李與英國駐澳領事會面，領事表示將會將意見轉知香港當局\", \"1953-5-2\": \"救總邀請內政部、外交部、國防部等機關，商議澳門六十三名難民來台問題\", \"1953-5-7\": \"澳門文化協會舉行會議，馬沙道敎授談\\\"新聞工作修養\\\"\", \"1953-5-12\": \"靑洲兵營花地瑪聖母節，一洞穴祭台和軍隊徽號燭台揭幕。燭光聖像出遊\", \"1953-5-13\": \"中國駐灣仔軍官金玉旺駕艇偷渡到澳門，據說金二十四歲，任中校管理員\", \"1953-5-21\": \"羅保博士在市政廳禮堂發表演講，演詞題目是\\\"澳門經濟的基礎和步驟\\\"\", \"1953-5-23\": \"哈利通先生獲委派為美國駐澳門總領事\", \"1953-5-24\": \"僑委會正式撤銷澳門中華教育會之立案\", \"1953-6-14\": \"華僑協會澳門分會下午二時在萬香酒店舉行成立典禮，與會者二百餘人，會後舉行簽訂反共抗俄公約，會中並通過上　總統及三軍將士致敬電\", \"1953-6-17\": \"國軍集中營黃述樁等六十二人乘船到港轉赴台灣，澳門警方對此事極為戒備，派出十名警員隨船護送，香港亦派出三艘炮艇護送，到達香港後便登上永生輪赴台\", \"1953-6-19\": \"國軍集中營黃述樁、陳子燊等六十二人到達台灣\", \"1953-7-1\": \"救總秘書長方治歡送國軍集中營來台之六十二人轉赴金門前線\", \"1953-7-17\": \"由澳門商會主席何賢陪同，香港舞龍團體領導人前往督轅向總督致意並在督轅門口表演（實為舞獅）\", \"1953-7-25\": \"澳門政府宣佈：凡是輸入澳門的糖，每噸將收稅二百葡幣，并規定糖稅必須於澳門貿易當局發給輸入許可證時繳付\", \"1953-7-28\": \"里斯本地理學會主席科雷亞向葡國海外部長羅瑟文提出「澳門開埠四百周年」相關的慶祝活可以分兩階段進行，第一階段設於1955年4–5月，在里斯本舉行；第二階段設於1955年11月，在澳門舉行\", \"1953-7-30\": \"葡文《澳門消息報》發表有關\\\"捐血者\\\"的文章，強調大部分受益者是華人，而大部分捐血者是葡人\", \"1953-8-1\": \"透過香港的澳門—美國無線電話電路開始試驗性運作\", \"1953-8-3\": \"救總繼續撥出兩萬港幣，由駐澳專員負責發放賬款\", \"1953-8-8\": \"批准仁伯爵綜合醫院的住院中央大樓的拆卸和興建圖則和預算。\", \"1953-8-10\": \"澳門工團總會成立整理委員會後，有關機關派員到該會，會同整理委員陳演生、李海、李森、鄭生、陳國夫、黃榮、梁炳、李基、陳飛英、陳偉勤、李壽山、朱綿和、楊有、陳應鴻、馮國等正式辦公\", \"1953-8-12\": \"國家航運公司船隻《印度》號到澳，帶來貨物和乘客\", \"1953-8-22\": \"紅綫女卄二來澳　演名話劇『雷雨』\", \"1953-8-27\": \"國家航運公司船隻《印度號》離澳，駛往里斯本，中途在馬尼拉、帝力、新加坡等地\", \"1953-9-1\": \"粵穗留澳新聞界四十多人，今在普濟禪院集合，今慶祝記者節及追悼新聞同業先烈\", \"1953-9-4\": \"澳門中山教育學院教授馮百礪前年在香港舉辦書法展，得到稱許，今在中央酒店一連三天舉辦書法展\", \"1953-9-5\": \"流放罪已被取代，並規定在葡國海外不再執行\", \"1953-9-7\": \"難總代救總發放第二期賬款，共發放52560葡幣，受領人數10512人\", \"1953-9-16\": \"駐澳英領事高雲舉行酒會，祝賀贏得\\\"巴桑領事\\\"杯的澳門海員俱樂部的運動員\", \"1953-9-18\": \"中德、仿林、知行、陶英等十一間學校，一致決定推行三民主義教育及使用正中書局課本\", \"1953-9-21\": \"澳門舉辦首屆華僑節，相關慶祝節目將由出席台灣僑務會議之代表李寶田、鄧晴隆、何心源等主持\", \"1953-9-22\": \"澳門郵電局首天發售\\\"花卉\\\"郵票\", \"1953-9-24\": \"里斯本地理學會主席高理亞訪澳\", \"1953-9-26\": \"為團結澳門各校愛國教師，馮百礪等48人發起組織一個以三民主義為中心思想的教育組織澳門中華自由教師聯合會，並於本日召開第一次籌備會，選出馮百礪、孫甄陶、馮漢樹、鄭逸雄、朱權、譚毓麟、陳鎮鴻、張衍日、麥孔檀、陳炳堃、王杰等十一人為籌備員，起草章程、制定入會表、公開徵求會員\", \"1953-9-27\": \"澳門工團總會成立整理委員會\", \"1953-9-28\": \"德明中學為慶祝教師節和高中畢業生投考台灣大學錄取率90%，在陶陶居酒家設宴\", \"1953-9-29\": \"參加世界勞工組織\\\"亞洲地區會議\\\"的葡國代表團成員到澳\", \"1953-9-30\": \"氹仔難民營青年李松齡、王樂天、黃彪等人發起「氹仔難民營摧毀偽國慶日先鋒隊」，進行張貼反共標語等行動\", \"1953-10-1\": \"清平、平安、國華、域多利、百老匯、東方六間戲院決定聯營，並推何賢為董事長，此次聯營為期三年，如可維持將繼續，必要時將關閉兩間戲院，以減少開支\", \"1953-10-10\": \"澳門僑團為響應華僑救國聯合總會發起之一元勞軍祝壽運動，今日起至三十一日止為捐款日，將於各區設立獻金箱\", \"1953-10-13\": \"望廈兵營舉行燭光聖像出遊，紀念花地瑪聖母\", \"1953-10-18\": \"救總代表黃熙到達澳門，將逗留澳門數日，前往各處探望中國難民，聽取意見\", \"1953-10-21\": \"澳門慶祝首屆華僑節，由華僑救國總會澳門分會擔任主席團主席\", \"1953-10-22\": \"澳門文化協會在伯多祿五世劇院舉行首次季節性音樂會\", \"1953-10-23\": \"香港工展會自開幕以來已有約四十萬人參展，澳門史伯泰夫婦今午參展，由大會主席許岳等人陪同\", \"1953-10-24\": \"銅馬廣場迴旋處賣物會正式開幕，爲澳門貧苦大衆籌募聖誕禮物\", \"1953-10-25\": \"澳門中華自由教師聯合會舉行會員大會，通過章程，選出馮漢樹等二十一人為理事，麥孔檀等七人為候補理事，馮百礪等人為監事，余退邨等三人為候補監事\", \"1953-10-26\": \"澳門一倫敦的無線電話服務揭幕\", \"1953-10-27\": \"澳門中華自由教師聯合會舉行第一次理監事聯席會議，選出張衍日等七人為常務理事，馮百礪等三人為常務監事\", \"1953-11-1\": \"受商場不景氣影響，東亞酒店已停業多月，今國際酒店旅業部及餐廳暫停營業，僅營運舞場及理髮部\", \"1953-11-12\": \"澳門中華自由教師聯合會借粵海大學舉行成立大會暨理監事就職典禮，並發表宣言，其中提到要努力闡揚三民主義\", \"1953-11-18\": \"蔣宋美齡接見澳門聖若瑟學校回國旅行團\", \"1953-12-3\": \"駐澳辦去信國父故居管理人馮漢樹，請他來駐澳辦商談國父故居一事\", \"1953-12-5\": \"總督史伯泰（Joaquim Marques Esparteiro）公佈成立“繁榮海島市計劃”委員會，推動氹仔和路環的建設，發展畜牧業、農業、航運業和旅遊業，同時要求委員會“選出地方，建設公共平民屋宇，增設學校、街市、警署、花園、公園”，使兩島從鄉郊發展為新市鎮\", \"1953-12-7\": \"駐澳辦向外交部發電報，指澳府打算開發氹仔、路環，請查中葡條約之規定是否有兩島，如不在，請駐葡公使館向葡方抗議阻止，以免既成事實增日後交涉難度\", \"1953-12-12\": \"委派一個委員會履行有關國家紀念物評定的法律\", \"1953-12-14\": \"外部電陳專員轉僑委會鄭委員長意見，請其向業主洽商價錢，收購前先與業主談租金，收購或租用後由駐澳辦管理並擬管理辦法\", \"1953-12-19\": \"澳門自由社團、學校借粵海大學禮堂舉行追悼吳鐵城大會，由駐澳專員陳元屏主祭，馮百礪及李伯顏陪祭，共有百多人參與\", \"1953-12-30\": \"駐澳專員陳元屏在港乘飛機回台述職，對記者表示台灣與葡國邦交和睦，故其在澳門之工作尚算順利，預計短期內將回澳\", \"1954-1-6\": \"澳門規定大米進口商每月供應公糧三千擔60元大米，由政府以45元收購，大米進口商建議改為進口時徵收每包3元，但不被澳門政府接受，因此澳門請香港停發大米山口證\", \"1954-1-10\": \"澳門單車職業自由工會一連兩日進行義載，以及義賣香港美國新聞處贈送之書刊「今日世界」，所得款項全用於香港賑災\", \"1954-1-12\": \"澳門區國大代表李秉碩在國際酒店三樓召開招待會，收集澳門僑胞意見，以便返台向國民大會轉達，馮百礪、何心源、老軍人李伯顏、中央社羅君實等人先後致詞\", \"1954-1-13\": \"澳門軍事法庭開審六宗爆炸案，主犯李東海、還有被告阮文浩、蘇安、鄭恒，另有包括商人馬萬褀等十多人出庭作證，李東海及阮文浩否認犯罪，表示僅搜集反共情報，但警方指出李、阮等人確有犯案，主事人馬子雄潛逃中，最後法官判李、蘇、鄭三人十一年四月徒刑，阮為四年徒刑\", \"1954-1-16\": \"立法建立澳門廣播電台\", \"1954-1-17\": \"吳公儀與澳門之陳克夫在澳門新花園泳池為當年香港石硤尾大火籌款名義舉辦的「吳陳比武」，比武前並簽下生死狀。甫交手即擊中陳克夫鼻子。陳因流血過多，休息超時。再因第二回合雙方起腳過膝犯規，裁判何賢宣佈「雙方不勝不負不和」而終止短短之數分鐘賽事，而是次比武亦籌得27萬澳門元善款\", \"1954-1-19\": \"澳門區國大代表李秉碩舉辦茶會招待新聞界，李在茶會中報告台灣近況，並回答記者問題\", \"1954-1-20\": \"英國遠東艦隊總司令林培海軍中將乘《柯力》號訪澳，翌日返港\", \"1954-1-23\": \"澳門憲報公佈，正式承認西德駐澳領事迪文在澳辦公，迪文去年秋已在澳門辦公，但葡京未作出批示，最近終於發出批示\", \"1954-1-24\": \"港澳商人黃豫樵八秩開一壽辰，其子黃家聰為父在澳門建壽椿亭今開幕，並向鏡湖醫院、中華總商會、孔教中學、中山教育學院、宏漢學校、中華婦女會托兒所等機構捐款\", \"1954-1-26\": \"吳陳比武大獲成功，籌得善款十多萬，澳門康樂體育會籌募善款主任委員梁昌，副主任委員何賢、崔德褀等人，於金陵大酒家設宴招待熱心慈善心士\", \"1954-1-28\": \"官印局新廈揭幕\", \"1954-1-29\": \"高德華（D. Policarpo da Costa Vaz）被委任第19任天主教澳門教區主教\", \"1954-2-1\": \"澳門區國大代表李秉碩及廣東省國大代表吳公虎，今乘飛機返台，準備參加國民大會第二次會議\", \"1954-2-10\": \"澳門基督教會宣道堂在高士德馬路100號正式啟用作禮拜堂\", \"1954-2-13\": \"委任一個委員會，負責照料省的總檔案室以及\\\"賈梅士\\\"貿易及民俗博物館所有設施\", \"1954-2-14\": \"振盛行之「大利華」輪由新加坡開出，經泰國後到香港，載運大米、椰油等貨物，今到澳門將貨物卸下\", \"1954-2-19\": \"國民大會第二次會議於台北舉行開會式，澳門區國大代表李秉碩與會\", \"1954-2-20\": \"《政府公報》頒佈有關海外省地面部隊的一般組織、招募和兵役法律\", \"1954-2-25\": \"鏡湖醫院舉辦衛生常識展覽會，期間並在清平戲院舉辦兒童健康比賽頒獎典禮，何賢主席主持\", \"1954-2-27\": \"據報章透過，香港一份報紙的通訊員李安奴市民定居氹仔\", \"1954-2-28\": \"澳門海上俱樂部和香港遊艇俱樂部在澳門水域舉行第九屆\\\"紅翼歌鵜級\\\"風帆\\\"港際\\\"比賽。本地風帆手贏得此次比賽\", \"1954-3-5\": \"法庭昨開審澳門康生洋行大火案，今法庭詢問澳門中國保險公司代理人張中成，關於被告康生洋行司理李正介、王子釗購買保險情形，以及大火後康生洋行求償經過等\", \"1954-3-6\": \"港澳客輪佛山輪由澳抵港，男子譚振被緝私員搜出黃金十多條，約重六十兩，價值港元一萬七千元，事後男子被帶回警局\", \"1954-3-11\": \"爆竹業自由工會集合各廠70多名代表，購買香煙、餅乾等物品前往慰問受國際酒店停業影響之自由工人\", \"1954-3-12\": \"澳門區國大代表李秉碩聯同二十多位國大代表於國民大會第二次會議提案：請政府確定港澳同胞為華僑身份享受華僑待遇\", \"1954-3-14\": \"澳門草地曲棍球隊再次與香港球隊作賽，贏三比〇\", \"1954-3-16\": \"海員工會國大代表朱克勤聯同三十多位國大代表於國民大會第二次會議提案：請政府設法從速將流落澳門之反共國軍，全部撤返台灣歸隊，以增強反共力量\", \"1954-3-17\": \"這兩天在東方戲院舉行演出，爲興建鮑思高中學籌款\", \"1954-3-18\": \"江蘇省國大代表陳倬聯同三十多位國大代表於國民大會第二次會議提出臨時動議：請政府即日將我國留澳門國軍集中營官兵眷屬一百七十八人，接運返國，以慰忠貞\", \"1954-3-21\": \"國家航運公司汽船《羅胡瑪》號離澳，前往里斯本，載有乘客和貨物\", \"1954-3-24\": \"盧怡若聯同前華人代表（其姪）盧榮錫致函祝賀蔣介石連任總統\", \"1954-3-31\": \"新興的印度尼西亞共和國總領事蘇里榮納和副領事阿霖查官式訪澳\", \"1954-4-3\": \"《政府公報》刊登通過澳門市公務員帛金章程條文\", \"1954-4-4\": \"為慶祝中華民國第二屆總統副總統就職大典，已成立澳門各界僑胞慶祝總統副總統就職大典大會籌備委員會，積極進行籌備，當地婦女界并組織回國觀光團，由大會推派女教育家李雪英為代表，現該團各項籌備就緒，定日內即可啟程來台，澳門各界僑胞慶祝總統副總統就職大典壽備委員會特於本月四日下午，舉行歡送茶會，到華僑救國團聯合總會理事鄧晴隆，華僑協會馬君豪，粵穗記者聯誼會代表羅君實暨當地各界僑領、社團領袖等多人，一致希望該團此次返國將全澳僑胞愛國愛領袖之熱情，帶回祖國，繼由主席將錦旗兩面，授與李雪英團長囑將該項錦旗返台時分別呈獻　總統副總統，并鄭重表示，此兩面錦旗，實代表全澳僑胞無形的精神力量，至可珍貴\", \"1954-4-7\": \"馮漢樹向陳專員發信，表示國父故居出售一事已得孫科書面同意，希望早日解決此事\", \"1954-4-10\": \"郵電局飯堂開幕\", \"1954-4-20\": \"澳門文化協會在市政廳禮堂舉行另一次演講會。法利亞電子工程師論述\\\"原子世界\\\"\", \"1954-4-21\": \"本澳衞生局長李必祿偕職員費理喇，訪問本報，順向本報道謝多年來之各方面協助，由本報社長趙斑斕，親自迎迓\", \"1954-4-27\": \"澳門上半年最後一批輸往美國之爆竹今集中運港，然後轉往美國，爆竹業進入淡季，多家爆竹廠停工，待下半年再次銷往美國為止\", \"1954-4-29\": \"澳門文化協會在市政廳的另一次演講會，題目是\\\"武装力量—種族生命力的暴露\\\"\", \"1954-5-4\": \"澳門赴台祝賀總統就職代表李雪英出席授旗及歡送茶會，茶會由粵穗記者聯誼會代表羅君實主持，鄧晴隆、蔡德誠等人發言，同時準備兩面錦旗獻總統、副總統\", \"1954-5-5\": \"墨西哥駐港澳領事官雅斯從香港來澳門訪問，今午返回香港\", \"1954-5-14\": \"澳門婦女界回國觀光團等今晨可抵達基隆，係由澳門德明中學教師八人組成，團長為校長李雪英，成員包括繆少卿、成慧瑩、譚素卿、曹慧媛等。中央委員會第三組，僑務委員會，為表示歡迎起見，特定歡迎程序，於今晨備專車赴基隆歡迎\", \"1954-5-16\": \"工人游泳棚 昨晨揭幕情形熱鬧 來賓極擠擁 一片鼓掌聲\", \"1954-5-20\": \"早上九時許，澳門僑胞在粵海大學廣場舉行慶祝蔣總統陳副總統就職大會，十二時放鞭砲，下午二時舉行總統杯籃球賽，晚間遊藝大會，包括大合唱、國樂大合奏、歌詠、舞蹈、話劇、雜耍等\", \"1954-5-27\": \"救總派出組長宋訓信出席內政部召開之會議，其中討論澳門難民入境處置\", \"1954-5-28\": \"反正來歸的羅德光義士，將於今（二十八日）晨七時，自香港搭乘永生輪抵達基隆，投入自由祖國的懷抱。國防部總政治部，軍人之友社總社等機關團體，均將派代表在碼頭上熱烈歡迎。羅德光義士現年二十四歲，廣東省開平縣人，曾被迫在匪「廣東軍區珠江軍分區獨立十五團」充當列兵，並被吸入匪黨組織，羅因不堪匪軍欺騙壓迫，於去（四十二）年十月藉口省親逃往澳門，並向我政府請求准予來台，為祖國服務。現經政府准其所請，乃由港乘輪來台；原籍廣東省開平縣的羅義士，曾在匪「廣東軍區珠江軍分區獨立十五團」當兵，並曾被匪黨吸收為「黨員」，但是眼看到匪共的各種暴行與專橫統治無時無刻不想脫離苦海，好在他是在澳門出生，便以「返澳探母」為名，逃離匪區，再由澳赴港，請准來台。他在匪區所經歷的實況和投奔自由經過，將向祖國全體同胞申述\", \"1954-5-30\": \"蔣總統於卅日中午在台北賓館歡宴各地歸國僑團正副團長，陳副總統亦在座，總統對各僑團此次遠道返回祖國，甚為欣慰。席間，泰國僑領張蘭臣、菲律賓姚迺崑、墨西哥陳珠錦、香港陸慕霞、大阪陳廷岳、韓國曾恭，菲律賓吳宗穆、澳門李雪英、橫濱龐柱琛、東京周崇奇、越南鄺魯久、印尼吳肆南、菲律賓施逸生等僑領，曾相繼發言，一致表示忠心擁護政府，完成反攻復國的大業\", \"1954-6-5\": \"葡語傳播津貼\", \"1954-6-11\": \"立法院審議四十三年度中央政府總預算案及其施行條例草案案前，院長張道藩率全體委員首先起立為在澳門病逝之立法委員張超良默念致哀\", \"1954-6-16\": \"參加亞洲人民反共會議之七個地區代表，在今天上午會議中發表演說，敘述各國共黨情形，澳門首席代表李女士申述澳門反共經過說：澳門居民在過去五年中已十分痛恨共黨。李女士認為由於鎮海會議，業已產生反共聯合陣線的新希望\", \"1954-6-20\": \"伯多祿五世劇院李珠麗獨唱會，由奧利敎授伴奏。收入撥歸鮑思高中學\", \"1954-7-4\": \"澳門主敎高德華抵澳，在望德堂受熱烈歡迎\", \"1954-7-13\": \"為紀念路環擊退海盜44週年，定這一天為海島市日\", \"1954-7-16\": \"自廣東經澳門來歸之義士羅德光，經國防部核准以下士階級，開始在某部隊受訓\", \"1954-7-20\": \"澳門鏡湖醫院慈善獎卷今發行\", \"1954-7-21\": \"僑務委員李秉碩在台灣「自由中國之聲」進行廣播，講述中共壓迫僑胞實況\", \"1954-7-23\": \"出席亞洲人民反共會議之港澳代表，今電越南代表，對日內瓦會議的越南協定表示反對，支持越南人民反共復國鬥爭\", \"1954-7-24\": \"通過白馬行醫院規章\", \"1954-7-26\": \"總督在何東中葡學校主持會議，向學習葡語科出色的華籍學生頒獎學金\", \"1954-7-29\": \"救總邀請有關代表，由秘書長方治主持，其中討論澳門難民將比照站景嶺先例，申請入境台灣一事\", \"1954-7-31\": \"通過在全國施行的新道路法典\", \"1954-8-2\": \"從中國逃到澳門的青年難民陳子仲經過救總的協助下，由香港乘坐輪船到達基隆碼頭，現場 除了救總的迎接外，還有中三組、僑務委員會、中華婦女反共抗俄聯合會等多達 千餘人，場面非常浩大。救總秘書長方治發言表示陳子仲的到來，如同「大陸所 有反共志士的歸來」。另基隆市長謝貫一說：陳的到來象徵「反共抗俄的勝利」。 陳說唯一的心願就是「參加反共戰鬥行列」\", \"1954-8-11\": \"近月有人偽造入台證，索價三千元，駐澳專員陳元屏為此澄清入台證有兩種，一是軍公人員向台灣省保安司令部申請，二是在台家屬向台灣省警務處申請，並無其他機構辦理，亦無派員到海外辦理\", \"1954-8-13\": \"外部電駐澳辦，表示與僑委會會商後請示行政院，陳慶瑜秘書長回覆，經中央委員會研究，因澳門環境及政府與黨財力困難，收購國父故居一事暫緩\", \"1954-9-1\": \"下環市政街市啟用，由史伯泰總督主持啟用儀式，該街市造價澳門幣320,000元，由華人承建商Vá San建造\", \"1954-9-7\": \"為響應總統救濟大陸災胞運動，澳門外省籍難胞團結機構之義聲平劇社今舉社員大會，即席捐款數十元\", \"1954-9-16\": \"佐治•歐華利像揭幕\", \"1954-9-20\": \"鏡湖醫院發行獎券籌款，在新花園舉行搞珠號碼\", \"1954-9-21\": \"澳門區國大代表李秉碩由台來澳，在其公寓向記者發表談話，其中談到有人利用「回國觀光團」進行舞弊行為\", \"1954-9-25\": \"氹仔光遠炮竹廠發生爆炸，死九人重傷十三輕傷三人\", \"1954-9-27\": \"報道指中國對外貿易局華南分局前駐澳門成員韓忠、陳逸林等四人因貪污問題，今於廣州遭槍決\", \"1954-10-1\": \"葡國外交部否認香港星島日報報道所載，該報於九月二十一日指中國於澳門訂購三十萬件救生衣\", \"1954-10-3\": \"澳門區國大代表李秉碩因有事務處理，兩月前由台來澳，今從港乘坐飛機返台\", \"1954-10-9\": \"中華總商會會址外面有一枚定時炸彈爆炸，門口處有損毀，但無人死傷\", \"1954-10-14\": \"何賢之父何澄溪逝世\", \"1954-10-30\": \"第一屆澳門格蘭披治大賽車開幕\", \"1954-11-12\": \"國父故居今開放，成國父誕辰紀念場所，澳門僑團、僑校前往膽仰銅像、獻花\", \"1954-11-19\": \"陸軍上尉薩爾加多經歷三十一個月在廣州的囚禁後，終於獲得釋放\", \"1954-11-25\": \"教育部正式否認澳門華南大學遷校台灣之說，並指該校並未立案，只在卅九年間批准予成立，以後因為辦理不善，只在澳門一家酒店裡租了一間房間，內僅有教員職員十人，學生二十餘人，根本不能成為大學，已命令改為學院及改組董事會並未遵辦\", \"1954-11-27\": \"由澳門越海文商學院院長馮漢樹等組織之澳門自由教師回國觀光團，定今(廿七)日下午，自港乘盛原輸首途來台，計程廿九日上午可抵基隆。該團抵台後，將在台參觀各級學校設備和教學情形，并赴南部參觀祖國各項建設，作為改善當地僑教的依據。茲將該團全團名單錄後團長馮漢樹、副團長葉恭信、秘書陳兆藻、團員王杰、盧重革、張衍雄、林中洲、陳滿樂等八人\", \"1954-12-2\": \"澳門一晚發生三次炸彈爆炸事件，地點分別位於瑞貞攤館、國際酒店、峰景酒店\", \"1954-12-3\": \"凌晨時分，澳門再次發生炸彈爆炸事件，地點位於平安戲院\", \"1954-12-5\": \"為慶祝1955年元旦，澳門各界三十多人會商，決定成立「澳門各界僑胞慶祝中華民國四十四年元旦大會籌備會」，推定鄧晴隆、馬君豪、羅君實、蕭景兆、鄭生、陳成、馬仁偉為設計小組委員，負責籌備事宜\", \"1954-12-6\": \"兩年前共排砲艇在公海上從一艘香港澳門間的英國輪渡上綁架兩位昔日中國國軍將領的故事，今天已由二十世紀福斯公司在克拉克蓋博和米契爾藍妮所主演的「幸運軍人」一片中攝為該片故事的一段。影片公司並且特地將前年九月廿五日午夜時分駛澳途中被共匪砲艇攔阻的輪渡「德星」輪租來拍片，以求其真實，當初共匪砲艇之攔阻德星輪及艇上共匪登輪情形均經一一實地重攝，昨夜之輪渡班次曾因此取銷\", \"1954-12-9\": \"旅澳門華僑砲竹業職業自由工會理事長陳國夫暨全體會員，於昨（九）日致電僑務委員會委員長鄭彥棻轉中華民國青年建艦復仇運動委員會，堅決表示，誓為建艦復仇運動的堅強後援\", \"1954-12-18\": \"日本首次直航澳門之貨輪「利巴流號」抵達澳門，因貨輪食水甚深而沒有駛入內港，用拖輪將煤運往澳門後，便赴香港\", \"1954-12-19\": \"前澳門警察局長因遊艇誤入橫琴島被中國拘留兩年多，今獲得釋放，從廣州回到澳門\", \"1955-1-4\": \"澳門今年旱期過久，食水儲量退減，自來水公司召開記者會發表制水問題，並公佈八項節水建議\", \"1955-1-10\": \"氹仔難民營發生火災，救總請駐澳專員陳元屏慰問災民，並撥出兩萬港元修葺房屋\", \"1955-1-14\": \"澳督史伯泰為「澳門開埠四百周年」活動籌備委員會舉行就職儀式，澳門土生葡人精英羅保為委員會主席\", \"1955-1-16\": \"孫中山女婿戴恩賽在澳門病逝\", \"1955-1-20\": \"自來水公司今正式公佈二月起開始制水，澳門市政廳已批准相關措施\", \"1955-2-1\": \"澳門工團總會召開第三屆會員大會，並依章程以工會為單位選出理監事，華人機器總工會、西菜麵包工會等工會當選事，人力車工會等當選監事\", \"1955-2-14\": \"氹仔難民營之難民比照站景嶺入境辦法，首先獲准來台之難民李鍾嶽等十二人拜訪救總秘書長方治\", \"1955-2-15\": \"鏡湖醫院慈善會、中華總商會、同善堂及工聯發起“澳門各界救濟貧苦市民籌款大會”，得到社會熱心人士支持，在澳、路、氹設三處地方發送救濟米合共45.6萬斤，救濟全澳失業工人和貧苦市民\", \"1955-2-18\": \"澳門國大代表、僑務委員李秉碩今在台「自由中國之聲」向海外僑胞進行廣播，主題為「為大陳國軍轉進敬告海外僑胞」\", \"1955-2-28\": \"澳門工團總會於五洲大酒店四樓舉行第三屆理監事宣誓就職典禮，有關機關派林蔭生為指導員，趙漢一為監誓員，主席陳演生致詞，來賓鄧晴隆演說\", \"1955-3-5\": \"中華總商會理事陳直生今於理事會上，報告澳門工商界回穗觀光團參觀過程，該團上月二十一日赴廣東，今月一日回澳，表示參觀過程中留有深刻及良好印象等\", \"1955-3-12\": \"史伯泰總督向海外部長羅瑟文發出機密函件，羅列了21 本再版和12本擬新版的書籍清單，建議由白樂嘉撰寫一部200頁左右的澳門官方歷史，以及日間和晚上舉行的慶祝四百周年活動計劃草案\", \"1955-3-14\": \"去年救總接獲澳門炮竹自由工會呼籲，請求救濟受光遠廣興泰兩炮竹廠意外爆炸事件影響的四十多名工人，近期救總撥款，本日炮竹自由工會理事長陳國夫在駐澳辦派發款項，駐澳專員親自向受傷工友及死者家屬慰問\", \"1955-3-15\": \"工團總會全體理監事攜帶一批大米前往青洲，慰問受青洲大火影響的自由工友，並向他們發放大米，每人七斤\", \"1955-3-19\": \"靑洲聖保祿托兒所落成，前日經告揭幕，由該區女修士主持所務，使靑洲一帶貧民，每日出外工作時，可能將兒女托該所管理\", \"1955-3-29\": \"澳門中華自由教師聯合會刊物《鐸聲》於青年節創刊，該刊物宗旨為宣揚台灣政令、三民主義等\", \"1955-3-30\": \"駐澳專員陳元屏在港乘機返台述職，對記者表示不知何時回澳，另受澳門政府及本地人協助，工作尚算順利\", \"1955-3-31\": \"澳門中山教育學院曾將校產向銀行及私人抵押葡幣兩萬八千元，作為學校營運經費，現債務合計利息共三萬一千元，債主催該校償還債務，但該校無力償還，澳門法院已通知不償還則會進行拍賣，教育部認為該校是海外文化鬥爭據點，因此邀請僑委會、駐澳專員陳元屏、救總等商議，教育部提議由救總補助兩萬葡幣，其餘款項由教育部撥出，但救總認為本案不屬救濟範圍拒絕\", \"1955-4-13\": \"經營澳門賭業長達24年，有「典當業大王」之稱的高可寧逝世\", \"1955-4-14\": \"港九粉麵製造業自由工會（香港）會員數人，被田記麵廠解僱，工團總會發表聲明聲援工人\", \"1955-4-17\": \"救總谷正綱理事長招待駐澳專員陳元屏，彼此交換救濟工作意見\", \"1955-4-23\": \"周恩來在萬隆會議中聲言要收回香港、澳門\", \"1955-5-11\": \"南方日報報道，中山縣及廣州市將梁騷仔等34名「反革命份子」判處死刑或徒刑，報道指他們從澳門潛入中山，從事爆破暗殺等行動，並繳獲武器、文件等\", \"1955-5-15\": \"澳門公佈參與第二屆亞洲人民反共會議名單，成員有容海襟、馮漢樹、虞承唐、鄧晴隆、李健、鍾漢忠、盛双等人\", \"1955-5-19\": \"澳門文化協會在市政廳禮堂舉辦演講會，白德雅主講\\\"迪尼斯作品中的女士\\\"\", \"1955-5-21\": \"海島市兒童公園（大氹仔的批地）\", \"1955-5-25\": \"澳門工團總會一連三天，代台灣省總工會向受青洲木屋區火災影響之自由工友發放大米，每人八斤\", \"1955-5-28\": \"總督史伯泰在氹仔主持消防站開幕\", \"1955-6-4\": \"成立\\\"體育運動委員會\\\"，以改善和指導澳門的體育活動\", \"1955-6-6\": \"台灣接運第二批國軍集中營難民到台，此次共接運官兵及家屬共61人，難民到台後獲50元慰問金，分送台北、基隆、台南、台中等市警察局衛生隊安置\", \"1955-6-10\": \"救總為第二批國軍集中營難民舉行於基隆博愛救濟院歡迎晚會，由秘書長方治主持，並邀請外交部領事鄭達洪，駐澳門專員陳元屏、僑務委員委員會委員李秉碩，省社會處科長朱伯龍等機關代表蒞會致辭慰勉，末由國防部康樂總隊表演各種游藝節目，並放映電影\", \"1955-6-12\": \"單車自由工會成員鄺倫，疑因債務問題被黑社會「友樂堂」兩人歐打，鄺倫將此事陳報工會，工會派出調查員前往友樂堂交涉不成，最後鄺倫報警並請工團總會主持公道\", \"1955-6-14\": \"曾被驅逐出香港之黃承山被妻子控告遺棄，其主張已沒有同居超過四年及虐待，澳門法院今判處准予離婚\", \"1955-6-17\": \"華商總會副理事，同善堂主席，建築商人兼新花園夜總會東主崔德祺，於本月（十七）日下午十一時約十分，在新花園夜總會門前偕家人登上（七二三）號車之際，突為數人以兩挺『司登』式衝鋒機槍龔擊案\", \"1955-6-21\": \"澳督史伯泰控告號角報，事緣去年一則關於政府消息的新聞，經審查後不准刊登，但號角報沒有理會並在香港派報，澳門法院今判社長馬沙度神父入獄十天，可易科罰金每天十元，且三年內不可再發生，被告當即表示會上訴\", \"1955-6-23\": \"本澳商人崔德祺及其家人，在新花園游泳池門前，被兇徒開槍襲擊，企圖行刺，茲特懸賞格三萬元，無論何人，倘能供給情報，使能將該等兇徒予以拘捕，及定罪者，將由本廳將賞格分給各供情報之人，並聲明所有情報，本應均絕對嚴守秘密，情報人姓名，永不宣佈，特此佈告，俾衆週知\", \"1955-7-5\": \"葡國政府通過本地區新的政治—行政章程\", \"1955-7-11\": \"英國駐澳門領事迪斯莫爾知會倫敦，籌備委員會起草了一份完整的計劃書，在11月慶祝開埠四百周年\", \"1955-8-6\": \"據澳門爆竹廠表示，光遠等廠商接獲訂購爆竹之美國公司告知，美國政府正考慮取消每年只可入口十五萬美元爆竹之限制，澳門廠商認為限制一旦取消，售價將會下降增加競爭力，美國公司因而增加訂單，廠商業務將好轉\", \"1955-8-18\": \"開始在平安戲院連續三天放映第一部有葡文字幕的外國電影\", \"1955-8-20\": \"華人代表李寶田今突然以退位讓賢為由，向澳督請辭華人代表\", \"1955-8-25\": \"澳督委任何賢為新任政務會議華人代表\", \"1955-8-26\": \"駐澳專員陳元屏此前回國述職及參加革命實踐學院訓練，今從台灣回到澳門，並表示不宜對台北共諜案發表意見，另駐菲及駐泰大使人選，政府尚未決定\", \"1955-9-1\": \"台灣召開華僑文教會議，澳門由粵海大學校長馮漢樹，明德中學校長李雪英，難胞義學校長陳演生，中山教育學院院長尹嘉，仿林中學校長朱權，教導主任曾憲忠，精華報陳述公代表出席\", \"1955-9-4\": \"僑務委員會主辦之僑教展覽，定今（四）日上午八時三十分在中華婦女反共抗俄聯合會孺慕堂舉行揭幕禮，由鄭委員長彥棻主持，并敦請海外各地來台參加來教會議代表張亦錚（泰）李其牧（越）李撐星（高棉）戴白水（星馬）章子勁（印尼）林雅秀（菲）王淑陶（港）陳演生（澳門）王昭德（日）下原義（韓）賈錫麟（歐）鄭文田（緬）等剪綵，展覽日期至本月八日止，一連五日\", \"1955-9-12\": \"澳門茶居自由工會為救濟失學工人子弟，培養自由工人子弟，設立「自由工人子弟學校」，推馮國、蘇煖、徐業初、朱錦、何珠、梁展惠、黃權等人為董事，馮國為董事長，校長為黃權，該校於今日正式開課\", \"1955-9-13\": \"海外各地回國出席文教會議之華僑代表，為向捍衛外島的守軍致敬，特推定代表組成前線勞軍團，定于今（十三）日出發有僑鄉之稱的金門地區，作為時兩日之訪問，並慰勞第一線守。此一華僑勞軍團體由越南、菲律賓、泰國、星馬、日本、韓國、高棉、印尼、歐洲、香港、澳門等地之華僑代表三十一人組成。華僑文教會議前線訪問團專機，定於今日上午八時起飛赴金門，預定在金門逗留兩日，於十四日下午返台\", \"1955-9-16\": \"亞洲人民反共聯盟澳門總會會長李健抵達菲律賓，參加亞洲人民反共聯盟第二次大會會的預備會議\", \"1955-9-23\": \"僑委會邀請有關部門商談澳門僑教，最後決定照香港孫氏獎學金辦法，在澳門設立助學金，高中名額50名，每月15元港幣，初中名額150名，每月10元港幣，經費由僑委會負責80%，教育部負責20%\", \"1955-10-1\": \"據傳賭牌承投人傅德蔭提出抗議，指由史伯泰總督夫人史劉蓮德贊助舉辦的南灣民眾園遊會場內設賭，有違其專營承批合同條款，園遊會忽告停辦，隨後宣佈閉幕\", \"1955-10-3\": \"新任華人代表何賢 今午在督轅就職 首次政務會議隨着就職後舉行 澳督史伯泰將軍親自主持典禮\", \"1955-10-5\": \"像往年一樣在南灣新的塡海區舉行的賣物會開幕，目的是爲貧苦大衆籌款\", \"1955-10-8\": \"香港總督葛量洪前往北京進行訪問，與周恩來聚餐時，得知中國政府反對紀念「澳門開埠四百周年」\", \"1955-10-9\": \"中華總商會舉行紀念辛亥革命四十四週年座談會\", \"1955-10-11\": \"英國外交部遠東局局長阿倫並不認為慶祝活動構成〝嚴重挑釁〞，還是於10月11日指示英國駐里斯本大使斯梯淩， 要求提供葡萄牙中央政府關於慶祝活動安排的情況和意見，並就英國要求修改或縮減慶祝活動計劃的建議，瞭解葡萄牙的反應。\", \"1955-10-12\": \"澳督與葡國中央政府商定所有細節後，正式公佈慶祝澳門開埠四百周年活動正式計劃書\", \"1955-10-13\": \"有70多艘中國漁船逃到澳門，救總電報駐澳專員陳元屏，請其前往慰問，並向每名漁民派發20元港幣慰問金\", \"1955-10-15\": \"香港總督葛量洪和英國駐澳門領事迪斯莫爾在香港會面，評估慶祝活動初步計劃安排後，得出結論：〝慶典以文化活動為主，其本身完全無可指摘。可能招來激烈反對的只有11月1日慶典正式開幕儀式上的總督講話和11月29日的紀念碑揭幕式，還有國際運動會，因為它可能被解讀為英國或其他國家對慶典的支持\", \"1955-10-19\": \"英國駐澳門領事迪斯莫爾與澳督史伯泰會面，告知港督與周恩來關於慶祝活動的談話內容，史伯泰向他表示已向葡國建議取消賽車以外的所有（澳門開埠四百周年）活動，會面結束後立即向海外部長文杜拉匯報\", \"1955-10-20\": \"台灣外交部回復駐澳專員指應否參與「澳門開埠四百周年」相關活動方面，如開幕禮由澳督邀請可選擇參與、授勛禮中沒有親中共人士前提下亦可參加、「中國敬禮」要先了解活動詳情，如沒有不利的情況同樣可參加、升旗禮則自行依當地情況決定\", \"1955-10-21\": \"葡國正式對外宣告因「財政資源」問題，取消澳門開埠四百周年慶祝活動\", \"1955-10-22\": \"史伯泰知會迪斯莫爾領事說，葡萄牙中央政府已經同意他的請求，取消慶祝活動了。另一方面，請他向葛量洪轉達〝對他所提供的寶貴幫助表示深切的謝意\", \"1955-10-23\": \"鏡湖醫院舉辦婦幼衛生常識展覽會\", \"1955-10-24\": \"何賢以私人的名義前往廣州參加廣交會，當時同行的還有中華總商會副會長馬萬祺和建築商崔德祺\", \"1955-10-25\": \"廣州新華社發佈的一條消息才正式開始。根據新華社的消息，由於中國人民和澳門中國居民的強烈反對，葡萄牙政府取消了慶祝活動。最後一段告誡說：〝澳門是中國領土。中國人民有權要求從葡萄牙殖民者手中收回其領土的這部分〞\", \"1955-10-26\": \"葡萄牙代表團訪問英國，團長為外交部長庫尼亞部長，其表示由於媒體披露了幾方近期就澳門紀念活動進行商議的內容，並被問及消息洩露的管道是否已經查明，葡萄牙政府非常尷尬。葡政府無法對他們在中共的壓力下取消了慶典的說法裝聾作啞。儘管他們願意隨時聽取中方的意見，但關係到其領土上的內政事務則只能歸葡萄牙政府自己處置，他們不能造成迫於外界壓力而更改既定政策的印象，建議英國向駐北京臨時代辦下達指令，要求他通知中國政府說，儘管葡萄牙當局不想把事情弄大，同時願意減低慶祝活動的規模，但是不同意完全取消慶祝活動。這關係到葡萄牙的〝面子〞\", \"1955-10-31\": \"何賢、馬萬祺和崔德祺回到澳門，帶來了廣東省副省長的警告，人民政府不會容忍慶祝活動或其他偽裝形式\", \"1955-11-12\": \"澳門各界僑胞今晨九時半在文第士街國父故居舉行紀念大會，各僑校僑團均懸旗紀念，晚舉行三民主義演講會。今日僑胞之赴國父故居向國父銅像獻花及瞻仰者，竟日不絕。同盟會旅港澳老會員中午在澳門粵海大學舉行紀念國父誕辰及該會成立五十週年，香港方而的會員多人，已早昨日趕至澳門參加\", \"1955-11-18\": \"麻瘋病人偉大之父、著名法國作家霍利洛訪問澳門後，在巴黎發表\\\"海外葡葡牙\\\"演講\", \"1955-11-23\": \"域多利戲院首演澳門\\\"歐亞影片公司\\\"製作的首部長篇故事影片\\\"漫長道路\\\"\", \"1955-11-28\": \"駐港英國皇家海軍上校袁溫乘巡洋艦\\\"卡迪根灣\\\"號訪澳，兩艘水雷快艇護航\", \"1955-12-2\": \"台灣接運國軍集中營傷殘難民萬福盛等八人到台\", \"1955-12-10\": \"荷蘭駐澳門臨時總領事獲承認\", \"1955-12-16\": \"警方突然搜查火船頭街皇宮旅店，拘捕五名可疑人士，據報該幫人等正密謀持械行劫\", \"1955-12-25\": \"《宗敎及祖國》雜誌刊登更換聖奧斯定敎堂木地板時發現的四塊石碑的碑文\", \"1955-12-26\": \"建造商會理事長區華焜前往南灣總督府謁見總督，請求延長鼓勵興建新樓宇的優惠法規\", \"1955-12-30\": \"澳門文化協會舉辦鋼琴獨奏會，由澳門出生的賈瑪莉小姐演出\", \"1955-12-31\": \"有「乒乓球少林寺」之稱的澳門陶英學校，今舉行港澳校友乒乓球聯歡賽，校友同時發起聚餐，澳門校友可至該校或中正書局購買餐卷\", \"1956-1-4\": \"在英殖民地香港舉行的一次記者招待會上，美國空軍國務秘書跨而勒斯被問到關於其政府對澳門和香港在受到入侵的情況下，美國將採取如何態度時，他宣佈說：〝美國是英國和葡萄牙政府的盟友。我們會與他們一道採取適當的在他們受侵略情況下的措施。\", \"1956-1-20\": \"澳督史伯泰夫婦於竹仔室設宴款待比利時駐港總領事夫婦，除澳門官員外，英國駐澳領事、泰國駐澳領事亦被邀請\", \"1956-1-27\": \"開始興建仁伯爵醫院肺結核病院\", \"1956-2-4\": \"中三組表示如無人購買國父故居，由郵政局買也好，如郵政局買後將其作為古蹟，國父銅像可放在莊嚴風景好的地方膽仰\", \"1956-2-8\": \"何賢夫婦、崔德祺夫婦從中國回到澳門並發表談話，何賢表示一介商人擔任政協會議特邀委員深感榮幸，崔德祺表示對中國今日之成就感到鼓舞\", \"1956-2-12\": \"澳門在農曆年初首次有葡國煙花表演\", \"1956-2-16\": \"有報道指外交部以派駐澳門專員辦事處秘書梁贗堯繼任駐墨爾本領事，另派吳文輝繼任駐澳門專員辦事處秘書\", \"1956-3-4\": \"澳門工團總會在新馬路53號3樓會址舉行慶祝成立三周年紀念大會暨第四屆理監事就職典禮，收到港九工團聯合總會賀電\", \"1956-3-5\": \"澳門中華海員自由工會理事長陳源、副理事長何源等港澳海員代表乘坐四川輪到達台灣，中華海員總工會、海員黨部等代表在碼頭歡迎\", \"1956-3-9\": \"駐澳辦向外部電，回覆中三組意見，大意指房屋屬私產，無法在購買上設條件，國父銅像方面孫家有意捐出來等事宜\", \"1956-3-10\": \"澳門代表團抵達馬尼拉參與第二屆亞洲人民反共聯盟會\", \"1956-3-16\": \"外部電駐澳辦，表示行政院秘書長於3.7日函稱，指黨部秘書長2.23日函稱故居出售後，銅像交澳門黨部及駐澳辦處理，現澳門黨部稱此事宜秘密，不好向澳府探詢，以免郵局不敢買，並附上澳門黨部與駐澳辦之意見及步驟，院長批示照原則交外部辦理（澳門黨部與駐澳辦之意見大概是澳門無合適人有財力可買，故希望由郵局買，假如由其買，暫不知會作何用，銅像一事等郵局買後再談會更好，以免郵局不敢買，而因澳門環境，此事最好秘密為首要，否則生變）\", \"1956-3-25\": \"中華總商會為商討辦理同胞回鄉掃墓事宜，今晚召集各社團、工會、同鄉會舉行座談會，制定申請發證辦法\", \"1956-3-26\": \"澳門工商界人士組團赴廣東參觀展覽，黃豫樵任團長，副團長陳直生、恆生銀號區子燕，全團共二十二人\", \"1956-3-28\": \"澳門與越南西貢恢復通航\", \"1956-3-29\": \"香港中華總商會接受澳門中華總商會委託，今開始辦理港九同胞清明節赴中山、珠海等地掃墓登記工作\", \"1956-4-1\": \"鑒於澳門沒有一個面向社會的群眾性美術組織，吳喜雨、關萬里、徐佩之、陳善朗、趙偉夫、馮印雪、陸昌、郭奇波、陳子明和譚智生等成立“澳門美術研究會”，並聘請何賢為名譽會長，該會與廣東美術工作者協會有聯絡\", \"1956-4-8\": \"澳門工商界回穗觀光團返澳，團長黃豫樵對記者發表此行感想，形容中國發展突飛猛進\", \"1956-4-12\": \"駐澳辦向外交部轉達自由教師電報，指指台灣長風象棋隊到港訪問，慰問僑胞達一個月之久，可以利用極短時間來澳促中葡關係，振奮僑胞並抵消中共宣傳，澳門新成立之象棋協會派人到港邀他們來澳，該隊接納，因此成立歡迎籌備會推派代表到港會商，費用由各界負擔，不料9日精華報說該隊以回台期限為由書面拒絕，此舉不顧澳胞期望，更將台灣出入境限制公開在報刊上，如何面對國家、人民、澳胞，如此害怕匪共如何反攻，本會礙於人心較來函請轉上級加以勸導及善後，今後有台灣來港慰問演出次團體，請順道來澳而安僑情\", \"1956-4-24\": \"僑務委員會委員長鄭彥棻向澳門西菜麵包業職業自由工會常務理事黎義海、華人機器總工會理事長李耀榮致函嘉勉，事緣據說親中共人士利誘兩人前往北京參觀「五一勞動節」，但被兩人拒絕\", \"1956-4-26\": \"\\\"葡人與中國發展貿易的初步嘗試\\\"是澳門文化協會舉辦的演講會，講者是高美土\", \"1956-4-29\": \"鏡湖醫院善會，昨日下午三時，在該院大禮堂舉行第六屆正副主席，及董事就職禮，同時舉行鏡湖護士助產學校第廿五屆學生戴帽禮，曁何澄溪紀念堂及澄溪銅像揭幕，到會者，有傅德蔭，沈香林，傅何美仙，戴文渭，李際唐，黃豫樵，黃仲良，黃漢興，何顯堂，吳鳴，源晉初，劉明新，崔德祺，陳立民，陳毅生，高濤，陳直生，區子球，李寬，陳滿，崔樂祺，黃平，陳善朗，林文照，佐歐治，鄧芬，黃德，彭彼得，陳律平，陳公善，羅柏心，冼熾昌等各社團工會代表，又香港工商界人士何柏，黃深明，周亮星，崔聘西，潘惠子，吳為章及該院董事，醫護人員等千數百人\", \"1956-5-10\": \"澳門郵電局發售八枚\\\"地圖郵票\\\"，重現了澳門半島和氹仔、路環兩島形象\", \"1956-5-17\": \"澳門中華自由教師聯合會一連兩天在蓮峰球場舉辦首屆全澳門自由僑校田徑運動大會，由駐澳專員陳元屏任名譽會長，馮漢樹任會長，何心源及張志城任副會長，共27所學校，400多名運動員參加，香港美國新聞處長及文化專員特別赴澳觀賽\", \"1956-5-19\": \"澳門美術研究會舉辦第一屆美術展覽會\", \"1956-6-1\": \"駐澳辦向外部電，大意指故居於6月底押期到期，政府有意收購應派人來澳處理\", \"1956-6-6\": \"駐澳專員陳元屏向外交部次長報告，指何賢正進行兩項工作，一是組街坊福利會，二是組澳門殖民地自治工作委員會，駐澳辦將留意後續發展\", \"1956-6-12\": \"教育部稱已召集有關機構討論故居一事，決議由駐澳辦設法延期至9.21日，並以紀念中學14間房屋換取故居，但澳府是否同意延期及換取，請駐澳專員與澳府會商，以便本部派員處理\", \"1956-6-15\": \"澳門婦女聯合會之刊物《澳門婦女》創刊，每月一期，通常每期兩版面\", \"1956-6-16\": \"駐澳辦向馮漢樹發函，表示已請外部轉教部，請其派人來澳處理故居，另告知外部想延期，但駐澳辦無權，請馮轉孫治平處理\", \"1956-6-23\": \"孫治平函陳專員，表示之前因政府有意收購故向郵局延期半年，但不知政府是否派員來澳收購，以便向郵局聲明及申請延期\", \"1956-6-25\": \"駐澳辦回函孫治平，指教部派人來澳，入境手續正由駐澳辦代辦中，請孫再延3個月\", \"1956-6-27\": \"孫中山先生之元配盧太夫人之姪孫，盧承合，由中山共區逃抵澳門\", \"1956-7-1\": \"救總制訂港澳個別來台旅費資助辦法，此日起將補助港澳個別人員來台船票一張，以及零用金15港幣（8歲以下8港幣）\", \"1956-7-19\": \"澳門知行中學舉行的該校附小弟廿屆畢業典禮中，重新投入祖國懷抱，改掛青天白日滿地紅旗，僑委會委員長鄭彥棻後致電該校嘉勉\", \"1956-7-27\": \"難總督委會向救總轉達工團總會擬設澳門自由勞工診所一案，救總決定撥出二千港幣補助該診所\", \"1956-8-1\": \"旅居港澳兩地國人請領中國護照，依照原有之規定，須先行呈請國內有關機關核准，轉行外交部始可核發護照，此項規定，較屬繁瑣，政府現為便利該地國人出國，特由外交部將請領護照手續予以簡化，本日起，嗣後旅居港澳國人只須向外交部駐澳門專員新事處辦理手續\", \"1956-8-11\": \"第三屆格蘭披治大賽車期間設\\\"現金大獎\\\"彩票抽獎\", \"1956-8-14\": \"教育部稱收購國父故居一案已請行政院核發專款，核示後再照辦\", \"1956-8-18\": \"通過海外公務員章程\", \"1956-8-19\": \"就國父故居一事，居港革命元老謝德臣到訪澳門，盧怡若請他拜訪駐澳專員陳元屏及孫科在澳管業代理人馮漢樹，陳稱對此事時刻注意，馮稱如台灣償還欠款，故居可售予台灣，得知兩人回覆後，謝再與盧會面後回港\", \"1956-8-21\": \"財政廳發表1955年澳門經濟狀況，指過去二十五年收支賬目仍有盈餘，但近年來受禁運影響，工商業較為冷淡，使政府稅收減少\", \"1956-8-22\": \"亞洲人民反共聯盟韓國總會今天宣佈，該會已向七個地區發出請柬，邀請參加即將舉行的亞洲人民反共聯盟的青年及學生會議，其中包括澳門地區\", \"1956-8-26\": \"澳門婦聯會昨下午二時，在渡船街廿七號新址中舉行慶祝遷址招待會，與會各界來賓有該會會員的家人。新址為一幢兩層大樓，昨天門前花牌似錦，喜氣盈庭\", \"1956-9-4\": \"駐澳專員陳元屏向外交部報告，昨天漁民林樹根等30人被我方敵後工作人員林舉綱策反，駐澳辦向每名漁民發放救濟費20元，林樹根等人後轉往香港\", \"1956-9-8\": \"葡當局已正式承認美國在澳門設立領事館，美當局已委出富來地氏為駐澳門第一任領事\", \"1956-9-15\": \"路環供水（更新管道）\", \"1956-9-18\": \"何賢、馬萬祺、崔德祺迎接到訪的澳門警察廳廳長施若瑟\", \"1956-10-9\": \"中德中學董事長鄧景范，校長盛光運召開記者會，表示近期校董會決議，將以三民主義作為教育要旨等\", \"1956-10-10\": \"有人抄錄掛有青天白日旗之三輪車車牌號，引起自由三輪車工友不滿，將多名男子包圍，雙方發生打架，警方到場後將他們拘回警署\", \"1956-10-14\": \"亞洲青年及學生反共會議在韓國在首都女子學院開幕，會議原定舉行四天，由於菲律賓、泰國、琉球及澳門的代表未到，會期將改為三天\", \"1956-10-16\": \"救總秘書長方治會見駐澳專員陳元屏及澳門自由教師代表馮漢樹，彼此交換救濟工作意見\", \"1956-10-22\": \"國民黨亞洲地區工作會議開幕，華僑救國總會澳門辦事處常委林小亞等人提出臨時動議:請中央迅速收購澳門總理故居\", \"1956-10-25\": \"澳門中山學院門前的信箱今晨有一炸彈爆炸，除信箱被炸至粉碎外，中山學院對門樓宇的窗玻璃，亦被炸碎，無人死傷\", \"1956-10-26\": \"本月三十一日為蔣總統七秩華誕，澳門各界成立祝壽大會，特製一串十五丈長巨型砲竹，內有煙花及「蔣總統萬壽無疆」壽詞。此串砲竹將送赴台灣，在總統府門前燃放。該串砲竹於今日清晨由大來輪運港，為慎重計，特派大會秘書陳鎮鴻為押運人\", \"1956-10-28\": \"葡文《澳門消息報》轉載里斯本《消息日報》文章，介紹作家江蓮達的著作《長衫》\", \"1956-10-29\": \"中國童軍第三次全國大露營及大檢閱舉行，有十一個地區確定來台參加，其中包括澳門，由張衍雄領隊，人數計八名\", \"1956-11-3\": \"初小敎育已是強制性的\", \"1956-11-5\": \"澳門童軍代表劉容肖等5人到達台灣，將參加祝壽團各項活動\", \"1956-11-12\": \"臺灣民聲日報記者專訪澳門回國祝壽團副團長、難胞義務中學校長陳演生，陳演生提到澳門教育、政治等議題\", \"1956-11-30\": \"澳門至加拿大長途電話正式開通，此條長途電話線途徑香港、倫敦、加拿大\", \"1956-12-7\": \"駐澳專員陳元屏上月回台述職，今乘飛機到港，預計留港一兩日\", \"1956-12-8\": \"規定在澳門進行旅遊活動\", \"1956-12-14\": \"外部電駐澳辦，就收購國父故居一事，已請行政院撥專款，行政院得總統核可，現外部正催有關機構撥款及派專人來澳辦手續\", \"1956-12-17\": \"工團總會舉行茶會，商討1957年元旦慶祝辦法，以及歡迎赴台觀光的瓜菜農業自由工會理事長陳演生，陳於茶會中報告赴台情況，另工團總會指導員陳鎮鴻主持頒發僑委會委員長嘉獎函儀式\", \"1956-12-21\": \"澳門海軍進行炮兵實彈射擊演習，部份區域禁航\", \"1956-12-29\": \"史伯泰政府任滿\", \"1956-12-30\": \"鏡湖舉辦的大型學術講座，這是鏡湖文字記載較早的大型學術交流活動。時任華南醫學院院長和鏡湖醫院慈善會副主席、鏡湖醫院院長的柯麟醫生率領幾位全國著名的醫學專家來鏡湖演講。柯麟院長作了“解放後祖國醫藥衛生事業的偉大成就”的報告，全國著名生物學家陳心陶教授介紹了“中國寄生蟲病概況及防治情況”，放射學專家及腫瘤醫學專家謝志光教授介紹X光技術發展情況\", \"1957-1-5\": \"駐澳辦回覆外交部，指何賢有意出資收購國父故居\", \"1957-1-14\": \"澳門青年回國觀光團一行十六人今乘四川輪抵台，團長蘇國榮另於後天乘飛機到台，團員多為足球員，將與台灣足球隊進行多場賽事\", \"1957-1-18\": \"澳門青年回國觀光團一行人到台灣大學參觀\", \"1957-1-26\": \"葡語：敎育、傳播和津貼\", \"1957-1-31\": \"澳門發生大火，四間店鋪及難胞義學與澳門瓜菜業職業自由工會二樓會址受到火燒，其中難胞義學約損失三千元\", \"1957-2-14\": \"外部電駐澳辦，指工商日報說傳台灣以27萬買國父故居之報道，查政府尚未決定也未派人辦理，消息與事實不符，其來源為何，又報稱據革命元老說國父未曾居住，銅像也是抗戰期間從中山遷往，請查明根據\", \"1957-2-16\": \"路環和氹仔軍事區域包括的地段\", \"1957-2-19\": \"駐澳辦回覆外交部詢問，指台灣收購國父故居之消息由出席亞洲黨務會議之澳門代表傳出，另表示國父應未曾居住於國父故居，銅像從翠亨鄉遷置園中\", \"1957-2-21\": \"澳門中華婦女會為籌備三八婦女節，下午在會內召開理監事座談會，理事長崔瑞琛致開會詞，座談會最後決定舉辦三項活動\", \"1957-3-8\": \"新任澳督白覺理（Pedro Correia de Barros）就任\", \"1957-3-16\": \"設立經濟資源硏究及評價委員會，由羅保博士主持\", \"1957-4-9\": \"外部電駐澳辦，指因葡外部指不拍賣，所以專款收購一事暫緩，改以出售14間房屋再收購，總統批「准如所擬辦理」\", \"1957-4-25\": \"茂成娛樂公司屬下麗聲戲院，昨日下午二時開幕，由永茂電影公司明星司馬華龍任司儀，蔡梅蘭小姐，嘉寶小姐，黃義剪綵\", \"1957-4-27\": \"澳門中華教育會舉辦第一屆澳門中華學生運動大會，該活動於蓮峰球場舉行，有超過40所學校，七百多名學生運動員參加\", \"1957-5-18\": \"亞洲電影協會首次製片人會議於產經大廈舉行，議程包括澳門申請退出該會\", \"1957-5-22\": \"澳門區國大代表李秉碩為訪問選民，從台灣乘坐飛機到港，同行者還有泰國中華會館理事長黃鴻秋\", \"1957-6-18\": \"自來水公司宣佈結束制水，為應付以後水荒，市政廳委員建議自來水公司在市面開闢多個水井，使屆時有水井可用\", \"1957-6-26\": \"澳門區國大代表李秉碩來澳分別會見澳督白覺理及澳門各大社團\", \"1957-6-27\": \"難胞義學校長陳演生與胞弟陳勵生因歐打教員，今判處入獄，但可易科罰金\", \"1957-7-1\": \"依據救總擬訂緊急救助辦法，此日起從中國大陸逃到港澳之難民，只要於一個月內提交證明申請登記，將獲發20港幣，澳門由難總督委會承辦此工作\", \"1957-7-7\": \"香港英文虎報駐澳門記者李安奴、法新社駐澳門記者波治、路透社駐澳門記者溫百泉、香港勞工報駐澳特派員區華、澳門中山時事報發行人鄭永平、澳門市民日報社長嚴慶騏、粵省留澳新聞界聯合會副理事長唐國明等澳門新聞界人士預計今日到達台灣訪問\", \"1957-7-12\": \"前美空軍飛行員布萊克伍德今日在記者招待會中說：他攜其韓國太太與小孩由澳門潛入竹幕，乃出於旅行家的一種「好奇心」希望看看大陸的情形，但結果卻被廣州共匪軟禁了兩個多月\", \"1957-7-13\": \"救總谷正綱理事長主持招待澳門新聞界回國觀光團\", \"1957-7-18\": \"副總統陳誠接見李安奴等澳門新聞界訪問團人士，李安奴向陳誠報告訪問金門的感想，會面結束後，訪問團下午前往亞盟中國總會參加座談會\", \"1957-7-20\": \"蔣總統二十日上午在總統府接見澳門中外新聞界觀光團，他們一行七人是由行政院新聞局長沈錡，外交部駐澳門專員陳元屏陪同謁見，總統對他們來到自由中國觀光考察，曾表示嘉慰和歡迎之意，並詢問他們這次在台灣各地訪問的觀感\", \"1957-8-6\": \"亞盟中國總會理事長谷正綱發出請柬，邀請亞盟十四個地區理事代表於九月下旬在台北舉行首屆亞盟理事會議，其中包括澳門容海襟（亞盟澳門總會理事長）\", \"1957-8-14\": \"救總谷正綱理事長會見印度僑領、駐菲律賓公使、駐澳專員陳元屏等人\", \"1957-8-27\": \"外部電駐澳辦，大意指孫治平於7.5日函行政院，希望由政府收購，經總統批「交核辦」下院。交財政部研議7項辦法（主要是政府撥款及產權處理等），總統8.7日指示可照辦\", \"1957-9-1\": \"經過數個月的工程後，路環平民村在1957年9月1日舉行揭幕儀式，澳門總督白覺理（Pedro Correia de Barros）、澳門主教高德華（Policarpo da Costa Vaz）、羅保（Pedro José Lobo）、陸毅（Luis Ruiz Suarez）等嘉賓到路環出席平民村的揭幕\", \"1957-9-6\": \"總統蔣介石接見救總秘書長方治，詢問港澳難民情況\", \"1957-9-14\": \"救總謝副秘書長主持澳門救濟工作檢討會\", \"1957-9-24\": \"海上颱風侵襲澳門，災情嚴重，當地貧苦人民及流澳難民被災後亟待賑救，中國大陸災胞救濟總會接獲澳方報告，當即匯款港幣五千元，交由澳門當地救濟團體辦理緊急救濟事宜\", \"1957-9-30\": \"澳門各界追悼大陸死難同胞大會，於九月卅日假中山教育學院舉行，參加者數百人\", \"1957-10-2\": \"警區副區長羅迪奇的表揚狀，因颱風\\\"哥利\\\"襲澳時在馬場區拯救被海水淹沒的災民\", \"1957-10-8\": \"外部電駐澳專員，大意指以中華民國政府名義收購國父故居，收購後由駐澳辦與當地有關單位商保管辦法，商定辦法前由駐澳辦管理\", \"1957-10-9\": \"駐澳專員陳元屏就澳門童軍於雙十節在蓮峰球場進行檢閱未獲許可一事，與澳督會面商討，澳督表示不反對活動，但當日慶祝節目甚多，澳門警力小，恐照料不周發生事故，檢閱一事可改期進行\", \"1957-10-10\": \"中國國民黨召開第八次全國代表大會，駐港澳總支部派出何康、鄭冠雄、李雪英、陳靜濤、張軍光、黃毅芸等六人出席大會\", \"1957-10-13\": \"聞英葡軍艦將於十五日在香港水域作第二次大戰以來的首次聯合演習，葡艦一艘昨天下午已自澳門抵港，準備參加演習。目前香港碼頭泊有英艦七艘美艦二艘\", \"1957-10-16\": \"駐澳辦回報外交部，指收到收購國父故居之專款27萬葡幣\", \"1957-10-20\": \"為慶祝華僑節於五洲酒店開會，主席保宗器（華僑協會澳門分會理事長）致開會詞，後崔瑞琛、鄭次平、潘偉乾等人演講，然由出席亞盟會議澳門代表陳國夫報告會議經過及台灣發展成就\", \"1957-10-24\": \"華僑救國聯合總會首屆代表大會召開，由馬來亞代表宋廷濱任主席，多個地區代表與會，其中澳門代表鄧睛隆與會\", \"1957-11-8\": \"為便利旅客貨口入口，澳門政府宣佈放寬青蔴、鋼纜等二十多種貨物，無需事先入口證以及免稅\", \"1957-11-9\": \"中德中學慶祝校慶，除聚餐、戲劇、音樂等活動外，今舉行本澳有史以來班際男女子組環澳步行比賽，全長約七英哩\", \"1957-11-15\": \"留港澳中國同盟紀念會一行十人到訪救總\", \"1957-11-28\": \"永樂戲院經擴建後，今重新營業，下午舉辦雞尾酒會，晚上放映「搜書院」等活動招待來賓\", \"1957-12-11\": \"何賢、馬萬祺、崔德祺、崔樂其接待來訪的葡國海外工商視察專員蒙爹路博士\", \"1957-12-14\": \"取消水警和稽查警，成立水警稽查隊\", \"1957-12-19\": \"台灣外交部進行人員調動，駐火奴魯魯總領事唐榴調任駐澳專員，駐澳專員陳元屏調回外交部\", \"1957-12-27\": \"駐澳專員陳元屏將奉調回台，澳門各界代表於駐澳辦內設宴款餞別\", \"1957-12-28\": \"澳門政府為施行新五件建設計劃，召開多場座談會，今最後一場，並宣佈十個項目：1.建築新樓2.建新式酒店3.溝通澳氹水面交通4.發展航運與修碼頭5.改善教育與衛生設施6.增設船塢7.發展各項娛樂事項（包括恢復跑狗）8.簡化設廠手績9.增建新病院與擴建山頂醫院10.扶助澳商對外貿易\", \"1957-12-31\": \"澳門禁止吸食毒品\", \"1958-1-1\": \"澳門區國大代表李秉碩赴金門勞軍，並向國軍將士致詞\", \"1958-1-5\": \"廣東省留澳新聞界聯誼會在召開會員大會改選第六屆理監事，前理事長羅君實為名譽會長，麥政之、鄧耀明、莫志航為常務理事、潘慶其、陳劍英、邊肇麟、余文暉為理事，陳琰為常務監事，歐祥光、曾大文為監事\", \"1958-2-1\": \"駐澳專員陳元屏向救總通報，負責派發濟助金的自由 教師聯會陳世英帳目不清，將會被迫辭職，以後改由李雪英派發，請救總不要因 陳世英處理不當，而影響教師權益，不再繼續派發濟助金\", \"1958-2-12\": \"工團總會為發展自由勞工運動，今於蓮峰球場舉行「全澳自由勞工運動大會」，並與「全澳田徑運動大會」合併進行\", \"1958-2-25\": \"澳門攝影學會成立，成為澳門有史以來第一個攝影學會，卓犖被選為第一屆副會長\", \"1958-3-4\": \"台灣外交部決定派外交部參事陳澤華繼任駐澳專員一職，前駐火奴魯魯總領事唐榴呈請留資停薪，予以照准\", \"1958-3-15\": \"澳門自由僑團回國觀光團一行十四人，由團長吳祺紹率領，于十五日由澳抵港，當午即乘四川輪赴台，作為期一個月的觀光，該團團員馬沙是該團的唯一葡籍人\", \"1958-3-21\": \"澳門十多個團體、學校聯電蔣總統，對日本與中國簽訂貿易協定一事，支持政府向日本提出嚴正抗議\", \"1958-4-4\": \"新任外交專員陳澤華到達澳門，據報有千多人在碼頭迎接他\", \"1958-4-6\": \"新任外交專員陳澤華參加金城酒店之迎新會\", \"1958-4-7\": \"新任外交專員陳澤華與孫中山之長孫孫治平在國父故居設宴\", \"1958-4-8\": \"救總秘書長方治招待澳門回國觀光團\", \"1958-4-9\": \"新任外交專員陳澤華此日起一連三天與僑團、僑胞見面交流\", \"1958-4-15\": \"外交部提醒新任外交專員陳澤華由於澳門情形特殊，不應高調行事,以免妨礙公務\", \"1958-4-26\": \"前任駐澳專員陳元屏今從港返台，陳擔任專員一職六年多，今回台灣外交部工作\", \"1958-5-5\": \"華僑救國聯合總會澳門辦事處舉行成立典禮，主席林小亞致詞表示，現 今國難當前，僑胞應團結一致\", \"1958-5-19\": \"中華海員總工會，以第四屆理監事會業經屆滿，刻正積極籌開第五屆全國會員代表大會，所有會員投票選舉代表，其中澳門分會四百八十一人，產生代表一人，所有分會共選出代表六十五人\", \"1958-5-29\": \"美國商務部宣佈放鬆對澳門之出口管制，並表示澳門政府會與美國合作，防止物資被運往中國\", \"1958-6-11\": \"中華民國駐葡國公使王化成接獲葡方通知,認為陳太過活躍,望他「緘默守成」\", \"1958-6-21\": \"中華民國駐葡國公使王化成再次通報葡方的不滿,外交部表示已提醒陳,澳門與中國大陸接壤,稍有不慎就會發生事故,要他定必遵守訓示。\", \"1958-7-9\": \"陳與澳門警察廳長會面,表示有關僑胞的重大利益,不會作過多讓步。廳長認為陳易生事端,將此事彙報澳督。\", \"1958-7-11\": \"亞盟中國總會在該會大禮堂以茶會歡迎自澳門投奔自由的「反共義士」李吉、張潔英夫婦\", \"1958-8-15\": \"《澳門日報》創刊\", \"1958-8-30\": \"路環官立小學開始入學註冊，該校定名爲\\\"戴思利司令\\\"學校\", \"1958-9-2\": \"葡國約見王化成，稱已拒絕中共建交的要求， 但中共壓力日增，要求中華民國政府於 10 月 1 日前把陳澤華調回台灣，並不再委派駐澳專員，表示這樣做可以保有駐澳辦\", \"1958-9-12\": \"王化成再發電報，指葡國提出「折衷辦法」，即 先請陳回國述職，情勢平穩後再通知返澳，王形容葡方態度堅決，難有讓步\", \"1958-9-14\": \"澳門區國大代表李秉碩來澳，大公報指此時澳門同胞正值要求嚴懲陳源、驅逐駐澳辦等事情，李此行受各方關注\", \"1958-9-15\": \"外交部請王化成盡力爭取陳留澳，萬不得已才可同意回國述職 2 至 3 週，但前提 是葡國先給予簽證\", \"1958-9-17\": \"葡國回復陳的留任，損害葡澳政府利益，且不能保證 陳一定可以返澳。最後，外交部擔心堅持陳留澳，假如 10 月 1 日或 10 日發生流 血事件，葡國一定不會容許駐澳辦的存在，於是令陳「回國述職」，之後再與葡方 商談回澳一事\", \"1958-9-24\": \"國產解放牌汽車正式上路，行駛四號巴士路線，此前何賢、羅保、羅保兒子羅碧等人曾乘坐解放牌汽車試車\", \"1958-10-8\": \"澳門政府表示雙十節不准掛國旗、燈籠、彩牌\", \"1958-10-10\": \"澳門華僑回國觀光祝壽團第一批人員黃兆鴻、簡而廉兩人，已於十日下午飛到台北，該團全部是五十八人，其餘五十六人將於三十日前分批到達\", \"1958-11-14\": \"中國空軍中校 陳剛逃抵澳門\", \"1958-11-15\": \"巴路士獲委任爲莫桑比克總督後便離開，魯彌士任護督\", \"1958-11-26\": \"廣興泰總辦事處刧殺案，法院判處被告關德支徒刑廿四年，梁東三年，陳光輝廿二年，杜一行廿三年，黃錦濤廿四年，藍兆廿三年\", \"1958-12-14\": \"萬里香貨倉起火，波及八間商鋪，有五人死於火災\", \"1958-12-28\": \"陳澤華去信駐澳辦，表示自己從 9 月 23 日回國後，駐 澳辦便一直由秘書柴祖蔭代理，現今被外交部調派往橫濱，希望以書面形式與柴 祖蔭交接\", \"1959-1-18\": \"公佈省務、海港及運輸局以及郵電局的專有團體人員年資表\", \"1959-1-24\": \"進行高士德馬路與提督馬路之間的大廈渠道接駁工程\", \"1959-1-30\": \"委任海島市常設評估委員會，其成員有土生人士巴士道工程師、羅迪奇工程師以及商業經理余捷興\", \"1959-1-31\": \"德星輪抵港後，又有六名持澳門學生證的學生被香港移民局拒絕登岸，最近屢次發生類似事件，引發學生家長不滿，認為往年沒有限制，今年突加限制\", \"1959-3-17\": \"港澳商人黃豫樵15日病逝，今於香港萬國殯儀館出殯，前往執紼或送花圈有何賢、梁昌等人\", \"1959-3-29\": \"澳門各界僑胞紀念革命先烈暨慶祝第十六屆青年節大會，於廿九日在國父紀念館花園舉行，大會通過「響應總統發表告西藏同胞文告，表示盡一切力量，支援西藏民族抗暴革命運動。」及「呼籲亞洲和世界民主國家，主持正義，同情西藏反共，予以有效支援」兩電\", \"1959-4-1\": \"籌備多時之澳門國父紀念館正式開幕\", \"1959-4-9\": \"亞盟澳門總會李安奴向亞盟中國總會理事長致函，表示支持西藏抗暴，同時附上一份關於此事之聲明\", \"1959-6-5\": \"據說中國將六名南斯拉夫人驅逐至澳門，入境澳門後尋求庇護\", \"1959-6-14\": \"出席漢城舉行的亞盟五屆大會約旦代表奧斯曼、澳門代表李安奴，馬來亞代表馬天英，於十四日晚同乘西北航空公司班機自東京抵達台北，將停留觀光一星期，亞盟中國總會，常務理事黃季陸，查良釗等在機場歡迎\", \"1959-6-20\": \"澳門崇實中學校長、香港商人、梁彥明之弟梁彥武於香港東華醫院病逝\", \"1959-7-8\": \"馬濟時獲委任爲澳門總督\", \"1959-7-9\": \"今晨，有共匪砲艇一艘追逐一隻搭有兩名華人的舢板。他們係自大陸逃向澳門，一艘葡國巡邏艇加以干涉，並將難民載上船。\\n\\n於是，共艇駛近葡國的巡邏艇，其船員以投擲手榴彈作威脅，除非葡人將華人難民交出。葡人船員不為共黨威脅所嚇，並要求共艇離去，因她已進入葡國領水內。\\n\\n共艇乃駛去，但突又調頭回來向葡艇撞去，並以一條繩繫住葡艇，而開始將它拖向共匪水域，但葡艇船員用刀將繫繩切斷。此際，澳門警方另一巡邏艇抵現場，共匪砲艇即待逃去\", \"1959-7-10\": \"華僑救國聯合總會常務埋事會第八次會議，昨日下午三時假中山堂光復廳舉行，會議通過數項事項，包括增聘北婆羅洲、澳門及紐西蘭地區名譽理事暨顧問，澳門地區名譽理事：葉向榮、吳盛秀、林兆雨、馮蔚叢、林煥文、甘觀麟、李奈、李仲玲、林錚、李誠、黃漢，顧問：黃森\", \"1959-7-17\": \"澳門政府官員、駐澳辦秘書柴祖蔭等各國駐澳外交人員、澳門主教等數百人於碼頭歡迎新任澳督馬濟時抵達澳門\", \"1959-8-18\": \"馬濟時中校的省政府就職\", \"1959-8-21\": \"台中發生嚴重水災，工團總會等40餘僑團、僑校發起救濟活動，下午借工團總會禮堂召開座談會，商討救濟事宜\", \"1959-8-27\": \"中國大陸災胞救濟總會，昨（二十七）日下午五時，在該會舉行茶會，歡迎來台訪問的澳門政府政務委員左次治夫婦，由理事長谷正綱及夫人，秘書長方治在場招待，外交部張秉心司長，陳元盛顧問，僑委會黃天爵副委員長，婦聯會皮以書總幹事，僑聯會董世芳秘書長等均參加，左次治氏在茶會上表示，他將盡力協助中華民國政府和民間救濟團體，救濟中國大陸投奔自由，流亡在澳門的難民\", \"1959-9-18\": \"新任澳督馬濟時（Jaime Silvério Marques）就任\", \"1959-9-21\": \"澳門政府今聲明可於雙十節搭建牌樓，而去年曾以安全理由禁止牌樓搭建\", \"1959-9-24\": \"一名綽號「發瘋仔」的男子於營地大街手持雙十捐冊，沿路勸捐，後有人懷疑此人為假冒者，即召警察將此人帶回拘留所\", \"1959-9-25\": \"六名中國少年難民逃澳門，獲粵難胞會理事長林舉綱、副理事長張創拔、保宗器、監事長葉向榮等人安置，商人黃兆鴻前往慰問，並招待他們到佛笑樓用餐\", \"1959-9-26\": \"澳門當局勸告國共雙方勿於雙十和十一張貼挑釁性之政治標語\", \"1959-9-30\": \"澳門各界自由僑胞追悼大陸死難同胞大會，三十日在中山學院大禮堂舉行，二千餘人參加。追悼會由我外交部駐澳門專員辦事處秘書邊球主祭\", \"1959-10-6\": \"在澳門任職的莫慶恩神父致力於難民工作，工作還伸展至中國的弱智人士和下身癱瘓人士\", \"1959-10-10\": \"澳門政府迫於形勢，乃由澳門警廳派出了大批的警察和消防隊員，於十日凌晨三時，攜了三大桶灰水，分到各慶祝國慶牌樓建立的所在，高架雲梯，把牌樓中的「國慶」兩字塗去，同時並把所有慶祝國慶字樣的布條拆除下來\", \"1959-10-27\": \"澳門葡國紅十字會，為籌募慈善基金，特舉辦一塲慈善小足球比賽，定今日下午五時半，在南灣球塲舉行，由香港二天堂隊對本澳紅黑隊，門券收一元及三元兩種\", \"1959-10-30\": \"華僑救國聯合總會全體理事會議通過之重申海外僑胞敦請蔣總統俯順民情，繼續連任案，定明(卅)日上午派代表至總統府及國民大會聯誼會呈遞，推定柯叔寶(菲)、李栽之(韓)、薛本貴(日)、蔡天(寮)、李雪英(澳門)、陳仲箎(沙勞越)、黃鴻秋(泰)、陳鐵魂(馬達加斯加)、王英琪(墨)、林伯鑄(琉)、周華植(越)、宋廷濱(星馬)、何康(港)、徐琚清(印尼)、劉廷猷(大溪地)、黃土生(占美加)等十六人前往呈遞\", \"1959-11-6\": \"聯合國第三委員會通過一項議案，授權聯合國難民事務高級專員接受捐款，並可使用款項用於救濟身在香港、澳門、越南、泰國等地的中國難民\", \"1959-11-8\": \"黃蘊玉國畫展覽會，昨日為第二天。因值星期日，參觀人士，更形擠擁，澳督馬濟時中校伉儷，于正午十二時半，偕秘書長施若瑟，及兩副官蒞會參觀\", \"1959-11-15\": \"今天是澳門大賽車的第二天正午十二時，在開賽後五分鐘，出現歷屆以來最大的一次慘劇，橫跨在南灣馬路一座天橋，由於二百多名觀眾擠在一起，突然倒塌，橋上二百多人呼救聲滾成一片，有卅多人從橋上墜地受傷\", \"1959-12-12\": \"即將開幕的氹仔官立小學命名若翰•天主官立小學\", \"1959-12-29\": \"一份政府文件規定，葡文報紙中「所有涉及總督閣下或直接、間接關係到政府利益的新聞」均須接受審查\"};\nconst entryText = entries[year + '-' + (month + 1) + '-' + selected] ?? '敬請期待';\nconst idx = Math.round((Date.UTC(year, month, selected) - Date.UTC(1950, 0, 1)) / 86400000) + 1;\nconst wd = new Date(year, month, selected).getDay();\nreturn {\nyears: years,\ncells: cells,\nmonthTitle: year + ' 年 ' + (month + 1) + ' 月',\nselectedLabel: year + ' 年 ' + (month + 1) + ' 月 ' + selected + ' 日',\nselectedWeekday: '星期' + wk[wd],\nentryText: entryText,\ndayIndex: '全書第 ' + idx.toLocaleString('en-US') + ' 天，共 3,653 天',\ngoPrev: () => shift(-1),\ngoNext: () => shift(1)\n};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
